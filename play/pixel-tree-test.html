const cv=document.getElementById('game'),engine=new BABYLON.Engine(cv,true,{adaptToDeviceRatio:true}),scene=new BABYLON.Scene(engine);engine.setHardwareScalingLevel(Math.max(1,devicePixelRatio/1.5));const V=BABYLON.Vector3;scene.clearColor=new BABYLON.Color4(.72,.86,.85,1);const cam=new BABYLON.ArcRotateCamera('iso',-Math.PI/2,1.02,33,new V(0,0,0),scene);cam.inputs.clear();cam.mode=BABYLON.Camera.ORTHOGRAPHIC_CAMERA;function resize(){engine.resize();let a=engine.getRenderWidth()/engine.getRenderHeight();cam.orthoTop=10.7;cam.orthoBottom=-10.7;cam.orthoLeft=-10.7*a;cam.orthoRight=10.7*a}resize();new BABYLON.HemisphericLight('day',new V(0,1,0),scene).intensity=1.2;const sun=new BABYLON.DirectionalLight('sun',new V(-1,-2,-1),scene);sun.intensity=.7;function mat(n,c,e){let m=new BABYLON.StandardMaterial(n,scene);m.diffuseColor=BABYLON.Color3.FromHexString(c);if(e)m.emissiveColor=BABYLON.Color3.FromHexString(e);return m}const grass=mat('grass','#73a65d'),forest=mat('forest','#44834c'),leaf=mat('leaf','#57a95c'),soil=mat('soil','#bca37b'),wood=mat('wood','#725138'),stone=mat('stone','#7a8972'),cave=mat('cave','#14221a'),gob=mat('goblin skin','#789b43'),leather=mat('goblin leather','#71503a'),steel=mat('steel','#bdc7bb'),water=mat('stream','#62b9c0','#104f54'),runes=mat('runes','#6de8d5','#24bcb0'),arrowmat=mat('arrow','#f9e9ad','#705e29'),towerMat=mat('defender','#3c6589'),red=mat('hp red','#c94342');function box(n,x,y,z,w,h,d,m){let a=BABYLON.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},scene);a.position.set(x,y,z);a.material=m;return a}function sph(n,x,y,z,w,h,d,m){let a=BABYLON.MeshBuilder.CreateSphere(n,{diameter:1,segments:9},scene);a.position.set(x,y,z);a.scaling.set(w,h,d);a.material=m;return a}function cyl(n,x,y,z,d,h,m){let a=BABYLON.MeshBuilder.CreateCylinder(n,{diameter:d,height:h,tessellation:10},scene);a.position.set(x,y,z);a.material=m;return a}const field=BABYLON.MeshBuilder.CreateGround('buildable ground',{width:31,height:20},scene);field.material=grass;field.isPickable=true;const wp=[[-12,-5],[-8,-5],[-4,-5],[1,-5],[6,-5],[9,-4],[10,-2],[9,0],[5,0],[0,0],[-5,0],[-9,0],[-10,2],[-9,4],[-4,4],[1,4],[6,4],[11,4]];const curve=BABYLON.Curve3.CreateCatmullRomSpline(wp.map(p=>new V(p[0],.08,p[1])),12,false).getPoints();let lengths=[0];for(let i=1;i<curve.length;i++)lengths.push(lengths[i-1]+V.Distance(curve[i-1],curve[i]));const total=lengths[lengths.length-1];for(let i=1;i<curve.length;i++){let a=curve[i-1],b=curve[i],dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz);let m=box('single dirt road',(a.x+b.x)/2,.045,(a.z+b.z)/2,1.4,.08,len+.13,soil);m.rotation.y=Math.atan2(dx,dz);m.isPickable=false}function pointAt(t){t=Math.max(0,Math.min(total,t));let i=1;while(i<lengths.length-1&&lengths[i]<t)i++;return V.Lerp(curve[i-1],curve[i],(t-lengths[i-1])/Math.max(.001,lengths[i]-lengths[i-1]))}function distanceRoad(x,z){let best=1e4;for(let i=0;i<curve.length;i+=2)best=Math.min(best,Math.hypot(x-curve[i].x,z-curve[i].z));return best}function tree(x,z,s){cyl('tree trunk',x,s,z,.47*s,2*s,wood).isPickable=false;sph('canopy',x,2.3*s,z,2.2*s,1.6*s,2*s,forest).isPickable=false;sph('leafy crown',x-.3*s,2.65*s,z+.2*s,1.4*s,1.15*s,1.3*s,leaf).isPickable=false}for(let i=0;i<35;i++){let x=-15+(i*7.23)%30,z=-9.6+(i*5.13)%19;if(distanceRoad(x,z)<2.6||x>8&&z>1||x<-10&&z< -2||z>6&&x< -8)continue;tree(x,z,.45+(i%3)*.14)}for(let i=0;i<30;i++){let x=-14+(i*4.33)%28,z=-8+(i*7.13)%16;if(distanceRoad(x,z)<1.8)continue;sph('mossy rock',x,.17,z,.36,.3,.43,stone).isPickable=false}
sph('cave hill',-13,1,-5,4,2.8,3.8,stone).isPickable=false;sph('goblin cave opening',-12.25,.75,-4.95,.95,1.5,1.4,cave).isPickable=false;for(let i=0;i<4;i++)box('cave posts',-13.5+i*.3,.7,-6,.14,1.4,.14,wood).isPickable=false;
// Pixel-art World Tree experiment: 2D dynamic texture mapped to a flat in-world plane.
// This is a first gameplay integration test, not the approved concept art converted 1:1.
function makePixelWorldTree(){
 const W=256,H=320,tex=new BABYLON.DynamicTexture('pixel-worldtree-sprite',{width:W,height:H},scene,false,BABYLON.Texture.NEAREST_SAMPLINGMODE);
 const ctx=tex.getContext();ctx.clearRect(0,0,W,H);
 let seed=731;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
 const px=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
 const line=(x,y,x2,y2,w,c)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='square';ctx.beginPath();ctx.moveTo(Math.round(x),Math.round(y));ctx.lineTo(Math.round(x2),Math.round(y2));ctx.stroke()};
 // Wide twisting roots, bark silhouette and branch scaffolding.
 for(let i=0;i<11;i++){let a=i*Math.PI/10,dx=Math.cos(a)*94;line(128,262,128+dx,291+Math.sin(a)*13,11-i%3,'#30271f');line(128,257,128+dx*.84,286+Math.sin(a)*10,5,'#7e6040')}
 line(127,260,112,139,55,'#2b261e');line(128,259,117,146,40,'#63442e');line(135,247,127,147,18,'#92704b');
 for(let i=0;i<12;i++){let x=124+(rnd()-.5)*34,y=135+rnd()*120;line(x,y,x+(rnd()-.5)*13,y+17+rnd()*23,2+i%3,i%3?'#322a23':'#ab8152')}
 for(let i=0;i<17;i++){let a=i*2.4,x=125+Math.cos(a)*75,y=125+Math.sin(a)*36-(i%4)*9;line(124,160,x,y,8,'#392e22');line(122,156,x,y-2,4,'#856343')}
 // Pixelated foliage: chunky irregular leaf clusters, multiple greens and highlights.
 const palette=['#102d2c','#18513c','#276a45','#35804a','#4a9952','#6cb260','#91c16d','#b5cc7b'];
 const blobs=[[78,96,47,32],[124,65,53,37],[177,98,48,34],[56,142,43,30],[192,146,46,31],[125,118,70,49],[105,37,37,28],[157,43,36,27]];
 for(let b of blobs){for(let i=0;i<440;i++){let dx=(rnd()*2-1),dy=(rnd()*2-1);if(dx*dx+dy*dy>1)continue;let x=b[0]+dx*b[2],y=b[1]+dy*b[3],shade=Math.max(0,Math.min(7,Math.floor(3-dy*2+rnd()*2)));px(x,y,3+rnd()*5,3+rnd()*4,palette[shade])}}
 // Luminous cyan rune in the trunk, drawn in low resolution.
 const glow='#27d9c7';line(123,195,136,208,5,'#136e6d');line(136,208,124,223,5,glow);line(124,223,111,208,5,glow);line(111,208,123,195,5,glow);px(120,204,7,8,'#b1fff0');
 for(let i=0;i<18;i++){let x=35+rnd()*188,y=40+rnd()*225;px(x,y,2,2,i%3?'#71edbb':'#e8bd66')}
 tex.update(false);
 const m=new BABYLON.StandardMaterial('WorldTree.PixelSpriteMaterial',scene);m.diffuseTexture=tex;m.diffuseTexture.hasAlpha=true;m.useAlphaFromDiffuseTexture=true;m.backFaceCulling=false;m.disableLighting=true;m.emissiveColor=new BABYLON.Color3(.9,.9,.9);
 const plane=BABYLON.MeshBuilder.CreatePlane('WorldTree.PixelSprite',{width:8.8,height:11},scene);plane.position.set(12,5.2,4);plane.billboardMode=BABYLON.Mesh.BILLBOARDMODE_Y;plane.material=m;plane.isPickable=false;
 return plane;
}
makePixelWorldTree();
for(let i=0;i<16;i++)box('stream',-15+i*.34,.035,7.6+Math.sin(i*.5)*.3,.52,.05,.65,water).isPickable=false;for(let i=0;i<8;i++)box('decorative bridge',-12+i*.27,.2,7.6,.26,.12,1.8,wood).isPickable=false;
let hp=20,gold=150,wave=0,active=false,remaining=0,spawnTimer=0,gameOver=false,paused=false,speed=1,selected=true,enemies=[],towers=[],shots=[],particles=[];const $=id=>document.getElementById(id);function notice(s){$('msg').textContent=s}function stats(){$('stats').textContent='❤️ '+hp+'  🪙 '+gold+'  🌊 '+wave+'/10';$('tower').textContent='🏹 Bogenschütze · 60 G'+(selected?' ✓':'')}function end(v){gameOver=true;$('end').style.display='flex';$('endtitle').textContent=v?'🏆 Smaragdwald verteidigt!':'💀 Der Weltenbaum ist gefallen';$('endsub').textContent='Welle '+wave+' · Erste spielbare Alpha'}function makeGob(){let root=new BABYLON.TransformNode('goblin raider',scene);let torso=sph('leather tunic',0,.54,0,.47,.61,.36,leather);torso.parent=root;let head=sph('olive green face',0,1.06,.08,.53,.46,.48,gob);head.parent=root;for(let s of [-1,1]){let ear=sph('pointed ear',s*.39,1.1,.06,.29,.17,.2,gob);ear.parent=root;let arm=sph('goblin arm',s*.35,.48,.08,.17,.42,.18,gob);arm.parent=root;let blade=cyl('dagger',s*.48,.25,.14,.08,.34,steel);blade.parent=root}return root}function spawn(){let root=makeGob();enemies.push({root,d:0,hp:26+wave*11,max:26+wave*11,spd:1.55+wave*.07,reward:11+wave,phase:Math.random()*6})}function startWave(){if(active||gameOver)return;if(wave>=10){end(true);return}wave++;remaining=5+wave*2;spawnTimer=.1;active=true;notice('Welle '+wave+' läuft!');stats()}function addTower(x,z){if(gold<60){notice('Nicht genug Gold!');return}if(Math.abs(x)>14||Math.abs(z)>8.7||distanceRoad(x,z)<1.45||Math.hypot(x-12,z-4)<2.4||Math.hypot(x+12,z+5)<2.3||z>6.6&&x< -9||towers.some(t=>Math.hypot(x-t.x,z-t.z)<1.1)){notice('Hier kannst du nicht bauen');return}gold-=60;let base=cyl('defender platform',x,.17,z,.76,.34,wood);let body=sph('blue defender',x,.72,z,.5,.8,.4,towerMat);let head=sph('defender head',x,1.23,z,.37,.36,.37,steel);for(let m of [base,body,head])m.isPickable=false;towers.push({x,z,cd:0});notice('Bogenschütze gebaut!');stats()}scene.onPointerDown=(e,pick)=>{if(gameOver||!selected||e.button===2)return;let ray=scene.createPickingRay(scene.pointerX,scene.pointerY,BABYLON.Matrix.Identity(),cam);let hit=scene.pickWithRay(ray,m=>m===field);if(hit&&hit.hit)addTower(hit.pickedPoint.x,hit.pickedPoint.z)};$('tower').onclick=()=>{selected=!selected;notice(selected?'Auf eine freie Wiese tippen':'Baumodus aus');stats()};$('wave').onclick=startWave;$('speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;$('speed').textContent='⏩ '+speed+'×'};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'⏸';notice(paused?'Pausiert':'Weiter')};let t=0;scene.onBeforeRenderObservable.add(()=>{if(gameOver||paused)return;let dt=Math.min(.05,engine.getDeltaTime()/1000)*speed;t+=dt;if(active&&remaining>0){spawnTimer-=dt;if(spawnTimer<=0){spawn();remaining--;spawnTimer=Math.max(.35,1.1-wave*.035)}}for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.d+=e.spd*dt;let p=pointAt(e.d),q=pointAt(e.d+.1);e.root.position.set(p.x,.06+Math.abs(Math.sin(t*9+e.phase))*.08,p.z);e.root.rotation.y=Math.atan2(q.x-p.x,q.z-p.z);if(e.d>=total){e.root.dispose(false,true);enemies.splice(i,1);hp--;stats();if(hp<=0){end(false);return}}}for(let tower of towers){tower.cd-=dt;if(tower.cd>0)continue;let target=null,dist=4.1;for(let e of enemies){let d=Math.hypot(tower.x-e.root.position.x,tower.z-e.root.position.z);if(d<dist){dist=d;target=e}}if(target){tower.cd=.75;target.hp-=20;let bolt=sph('magic arrow',tower.x,1.1,tower.z,.18,.18,.18,arrowmat);bolt.isPickable=false;shots.push({mesh:bolt,target,life:.18});if(target.hp<=0){gold+=target.reward;target.root.dispose(false,true);enemies.splice(enemies.indexOf(target),1);stats()}}}for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.life-=dt;if(s.life<=0||s.target.root.isDisposed()){s.mesh.dispose();shots.splice(i,1)}else{s.mesh.position=V.Lerp(s.mesh.position,s.target.root.position.add(new V(0,.7,0)),Math.min(1,dt*15))}}if(active&&remaining===0&&enemies.length===0){active=false;gold+=25+wave*3;notice(wave===10?'Alle Wellen geschafft!':'Welle geschafft! Bonusgold erhalten');stats();if(wave===10)end(true)}});stats();engine.runRenderLoop(()=>scene.render());addEventListener('resize',resize);</script></body></html>
