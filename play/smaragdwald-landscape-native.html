const cv=document.querySelector('canvas'),out=cv.getContext('2d'),W=960,H=440,buf=document.createElement('canvas');buf.width=W;buf.height=H;const c=buf.getContext('2d');let seed=1729;const rand=()=>{seed=seed*16807%2147483647;return seed/2147483647},R=(a,b)=>a+(b-a)*rand();function polygon(a,col){c.fillStyle=col;c.beginPath();a.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill()}function stroke(a,col,w){c.strokeStyle=col;c.lineWidth=w;c.lineJoin='round';c.lineCap='round';c.beginPath();a.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke()}function ellipse(x,y,rx,ry,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill()}function rect(x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}

}

</script></body></html>
