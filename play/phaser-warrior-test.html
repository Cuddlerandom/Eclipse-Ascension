<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ECLIPSE · Phaser Krieger Test</title><style>*{box-sizing:border-box}body{margin:0;background:#101d19;color:#eaf5e9;font:14px system-ui}header{padding:12px 14px;background:#1a3228}h1{font-size:17px;margin:0 0 5px}p{margin:0;color:#bdd4c5}#game{height:calc(100dvh - 145px);min-height:320px;touch-action:none}footer{padding:10px;background:#1a3228;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{background:#315e49;color:#fff;border:1px solid #81ad8e;border-radius:8px;padding:9px}#info{font-size:12px;color:#d9e8d6}a{color:#c7e9cc}</style></head><body><header><h1>⚔️ ECLIPSE: ASCENSION · Phaser-Prototyp V0.1</h1><p>Original-Krieger-Sheets · echte Phaser-Animationen · iPhone-Touchtest</p></header><div id="game"></div><footer><button id="attack">⚔ Angriff</button><button id="idle">Stehen</button><button id="run">Laufen</button><select id="direction"><option value="vorne">Vorne</option><option value="hinten">Hinten</option><option value="links">Links</option><option value="rechts">Rechts</option></select><span id="info">Phaser wird geladen …</span><a href="sprite-inspector.html">Sprite Inspector</a></footer><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>
(()=>{'use strict';const info=document.getElementById('info');if(!window.Phaser){info.textContent='Phaser konnte nicht geladen werden (Internet/CDN prüfen).';return}
const directions=['vorne','hinten','links','rechts'],anims={idle:[6,7],run:[8,11],attack:[8,12],hit:[4,8]},path=[[130,1370],[480,1370],[480,1080],[930,1080],[930,1350],[1500,1350],[1500,920],[1910,920],[1910,560],[1330,560],[1330,280],[2200,280]];let scene,warrior,mode='run',dir='vorne',target={x:480,y:1370},index=1,auto=true;
class TestScene extends Phaser.Scene{constructor(){super('test')}
preload(){for(const d of directions)for(const a of Object.keys(anims))this.load.spritesheet(d+'_'+a,'../assets/heroes/krieger/level1-v1/sheet_'+d+'_'+a+'.png',{frameWidth:160,frameHeight:160})}
create(){scene=this;const g=this.add.graphics();g.fillStyle(0x31543a).fillRect(0,0,2400,1600);g.lineStyle(105,0x765c42).beginPath();path.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.strokePath();g.lineStyle(80,0xc5a57a).beginPath();path.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.strokePath();for(const d of directions)for(const [a,[frames,fps]]of Object.entries(anims))this.anims.create({key:d+'_'+a,frames:this.anims.generateFrameNumbers(d+'_'+a,{start:0,end:frames-1}),frameRate:fps,repeat:a==='attack'||a==='hit'?0:-1});warrior=this.add.sprite(path[0][0],path[0][1],'vorne_idle').setOrigin(.5,.9).setDepth(5);warrior.play('vorne_run');this.cameras.main.setBounds(0,0,2400,1600);this.cameras.main.setZoom(Math.min(this.scale.width/900,this.scale.height/620));this.cameras.main.startFollow(warrior,true,.07,.07);this.input.on('pointerdown',p=>{if(p.wasTouch&&p.event?.target?.closest?.('button'))return});info.textContent='Phaser '+Phaser.VERSION+' · Originalgrafiken geladen · Run';this.load.on('loaderror',f=>{info.textContent='Fehler beim Laden: '+f.key})}
update(_,delta){if(!warrior)return;if(auto&&mode==='run'){const dx=target.x-warrior.x,dy=target.y-warrior.y,dist=Math.hypot(dx,dy),step=185*Math.min(delta,.05)/1000;if(dist<=step){warrior.setPosition(target.x,target.y);index=(index+1)%path.length;target={x:path[index][0],y:path[index][1]}}else{warrior.x+=dx/dist*step;warrior.y+=dy/dist*step}const nd=Math.abs(dx)>Math.abs(dy)?dx>0?'rechts':'links':dy>0?'vorne':'hinten';if(dir!==nd){dir=nd;document.getElementById('direction').value=dir;warrior.play(dir+'_run',true)}}}}
const config={type:Phaser.AUTO,parent:'game',width:960,height:640,backgroundColor:'#31543a',scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},render:{pixelArt:true,antialias:false},scene:TestScene};const game=new Phaser.Game(config);
function play(a){if(!warrior)return;mode=a;auto=a==='run';warrior.play(dir+'_'+a,true);info.textContent='Phaser '+Phaser.VERSION+' · '+dir+' / '+a+' · Original-Sheet';if(a==='attack')warrior.once(Phaser.Animations.Events.ANIMATION_COMPLETE,()=>{if(mode==='attack')play('idle')})}
document.getElementById('attack').onclick=()=>play('attack');document.getElementById('idle').onclick=()=>play('idle');document.getElementById('run').onclick=()=>play('run');document.getElementById('direction').onchange=e=>{dir=e.target.value;auto=false;mode='idle';play('idle')};
})();</script></body></html>
