<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ECLIPSE — Smaragdwald Atmosphäre</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081815}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}.label{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 12px);color:#e3e7bd;font:11px system-ui;letter-spacing:2px;text-shadow:0 2px 4px #06120f;pointer-events:none}.label b{display:block;font:23px Georgia,serif;letter-spacing:3px}.bottom{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 13px);width:100%;text-align:center;color:#b4d1ba;font:11px system-ui;text-shadow:0 2px 4px #000;pointer-events:none}</style></head><body><canvas id="view"></canvas><div class="label"><b>ECLIPSE</b>ASCENSION · SMARAGDWALD</div><div class="bottom">ATMOSPHÄRENSTUDIE · PIXEL-ART · KEIN GAMEPLAY</div><script>
const cv=document.getElementById('view'),out=cv.getContext('2d',{alpha:false}),W=480,H=300;const layer=document.createElement('canvas');layer.width=W;layer.height=H;const c=layer.getContext('2d');let seed=1947;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646},R=(a,b)=>a+rnd()*(b-a);
function rect(x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function poly(pts,col){c.fillStyle=col;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fill()}
function stroke(pts,col,w){c.strokeStyle=col;c.lineWidth=w;c.lineCap='square';c.lineJoin='round';c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke()}
function ellipse(x,y,rx,ry,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill()}
const greens=['#102c29','#143b31','#20513a','#2c6642','#3c7947','#548c4e','#6f9d57','#91b368'];
function foliage(x,y,rx,ry,light=0){ellipse(x+3,y+5,rx+4,ry+2,'#10271f');for(let i=0;i<320;i++){let dx=R(-1,1),dy=R(-1,1);if(dx*dx+dy*dy>1)continue;let idx=Math.max(0,Math.min(7,Math.floor(2.5-dy*2+light+R(-1,2))));rect(x+dx*rx,y+dy*ry,R(2,6),R(2,4),greens[idx])}}
function rock(x,y,s){poly([[x-s,y],[x-s*.65,y-s*.55],[x+s*.2,y-s*.8],[x+s,y-s*.35],[x+s*.8,y+s*.45],[x-s*.6,y+s*.4]],'#344e43');poly([[x-s*.65,y-s*.55],[x+s*.2,y-s*.8],[x+s*.15,y-s*.15],[x-s*.35,y]],'#69816a');rect(x-s*.6,y+s*.1,s*.7,2,'#71965b')}
function fir(x,y,s){stroke([[x,y],[x,y-s]],'#352f25',3);for(let k=0;k<4;k++){let yy=y-s*.83+k*s*.18;poly([[x,yy-s*.25],[x-s*(.18+k*.04),yy+s*.12],[x+s*(.18+k*.04),yy+s*.12]],greens[1+k%3])}}
function worldTree(){
 // Ancient raised roots and stone plinth
 ellipse(340,232,103,26,'#10271e');ellipse(337,224,91,24,'#4b5843');
 for(let i=0;i<28;i++)rock(258+i*6.1,225+Math.sin(i*.53)*8,R(4,9));
 for(let i=0;i<13;i++){let a=i*Math.PI/12;stroke([[340,214],[340+Math.cos(a)*R(34,80),235+Math.sin(a)*15]],'#382d25',R(5,12))}
 // trunk is twisted, with bark ridges
 stroke([[340,211],[335,177],[344,140],[332,110],[342,73]],'#29251e',48);
 stroke([[340,210],[335,177],[344,140],[332,110],[342,73]],'#5a3e2b',34);
 stroke([[347,208],[344,171],[353,137],[343,106]],'#8a6541',10);
 for(let i=0;i<19;i++){let x=326+R(0,30),y=99+R(0,110);stroke([[x,y],[x+R(-9,9),y+R(9,24)]],i%3?'#392b25':'#b08050',R(1,3))}
 // boughs, reaching out beyond crown
 const limbs=[[[339,130],[286,83],[251,64]],[[338,118],[388,77],[423,61]],[[339,106],[324,58],[312,33]],[[344,129],[400,105],[448,97]],[[329,135],[278,119],[236,104]]];
 for(let p of limbs){stroke(p,'#332b23',13);stroke(p,'#8b6542',5)}
 // leaf clusters built from pixel clusters
 [[251,61,39,25],[289,43,45,30],[337,27,52,32],[393,48,48,30],[433,81,39,29],[277,93,50,28],[349,72,65,34],[399,103,44,28],[317,106,54,29]].forEach((b,i)=>foliage(...b,i%3===0?1:0));
 // rune lines drawn into bark
 stroke([[338,151],[349,162],[338,176],[327,163],[338,151]],'#075d62',8);
 stroke([[338,151],[349,162],[338,176],[327,163],[338,151]],'#42e7d3',3);
 stroke([[338,157],[338,170]],'#d0fff1',2);
 for(let i=0;i<10;i++){let x=280+i*14;rect(x,222+Math.sin(i)*7,2,5,'#3ee5c7')}
 // suspended amber lanterns
 for(let p of [[278,101],[403,123],[427,105]]){stroke([[p[0],p[1]-18],[p[0],p[1]]],'#654a2d',1);rect(p[0]-3,p[1],7,9,'#6e4527');rect(p[0]-1,p[1]+2,3,5,'#ffcf6e')}
}
function renderStatic(){
 rect(0,0,W,H,'#0c2227');for(let y=0;y<180;y++)rect(0,y,W,1,y<90?'#102b31':y<145?'#16362f':'#204238');
 for(let i=0;i<45;i++){let x=R(-20,500),y=R(30,180);fir(x,y,R(26,65))}
 // ground layers
 poly([[0,173],[64,153],[160,170],[226,159],[315,167],[420,159],[480,183],[480,300],[0,300]],'#294a36');
 poly([[0,208],[80,187],[167,194],[249,181],[354,199],[480,191],[480,300],[0,300]],'#31583c');
 // creek curves through foreground
 poly([[0,254],[55,246],[108,251],[161,269],[215,282],[280,287],[350,278],[480,289],[480,300],[0,300]],'#0d3c45');
 poly([[0,260],[56,252],[109,257],[162,275],[214,288],[281,293],[351,284],[480,295]],'#267e81');
 for(let i=0;i<140;i++){let x=R(0,W),y=R(254,301);if(x<165&&y<254+x*.12)continue;rect(x,y,R(2,7),1,i%3?'#247078':'#7bc5ad')}
 // path to world tree
 poly([[110,300],[164,276],[214,261],[250,238],[280,222],[318,219],[340,225],[320,238],[286,250],[257,271],[219,288],[180,300]],'#806b4d');
 poly([[145,300],[182,280],[239,252],[282,228],[313,222],[327,224],[292,236],[251,262],[202,287],[177,300]],'#aa8960');
 for(let i=0;i<150;i++){let x=R(180,318),y=R(230,288);rect(x,y,2,1,i%2?'#d2a875':'#705e48')}
 // distant vegetation, ruins, stone bridge
 for(let i=0;i<42;i++){let x=R(0,W),y=R(174,249);if(x>255&&x<447&&y>201)continue;foliage(x,y,R(5,14),R(3,8),-1)}
 for(let i=0;i<13;i++){let x=R(0,240),y=R(185,260);rock(x,y,R(4,12))}
 rock(196,227,14);rock(224,217,9);
 for(let i=0;i<5;i++){let x=30+i*12;rect(x,241,9,6,'#6c6e56');rect(x,238,9,3,'#9b9970')}
 // tiny amber lanterns and glowing mushrooms
 for(let p of [[88,219],[228,196],[452,226]]){rect(p[0]-4,p[1],9,17,'#505345');rect(p[0]-2,p[1]-4,5,7,'#ffc46b');rect(p[0]-1,p[1]-5,3,3,'#fff1a8')}
 for(let i=0;i<32;i++){let x=R(0,W),y=R(201,288);rect(x,y,3,2,i%2?'#47cfbd':'#a8d6a0')}
 worldTree();
 // foreground silhouettes
 for(let x of [-7,13,463,485])fir(x,292,65);
}
renderStatic();const particles=Array.from({length:76},()=>({x:R(0,W),y:R(30,285),p:R(0,6.28),v:R(.1,.5),s:R(1,2.5)}));
function frame(t){const dpr=Math.min(devicePixelRatio||1,2),w=Math.floor(innerWidth*dpr),h=Math.floor(innerHeight*dpr);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}out.imageSmoothingEnabled=false;const scale=Math.max(w/W,h/H),sw=W*scale,sh=H*scale,ox=(w-sw)/2,oy=(h-sh)/2;out.drawImage(layer,ox,oy,sw,sh);
 // Magical lights animate over static scene at native output scale.
 for(let p of particles){let x=p.x+Math.sin(t*.0006+p.p)*5,y=p.y+Math.sin(t*.0009+p.p)*7;let alpha=.35+.4*(.5+.5*Math.sin(t*.002+p.p));out.fillStyle='rgba(85,247,199,'+alpha+')';out.fillRect(Math.round(ox+x*scale),Math.round(oy+y*scale),Math.max(1,p.s*scale),Math.max(1,p.s*scale))}
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
