const cv=document.querySelector('canvas'),ctx=cv.getContext('2d');const w=900,h=520,buf=document.createElement('canvas');buf.width=w;buf.height=h;const c=buf.getContext('2d');let seed=93;const rand=()=>{seed=(seed*16807)%2147483647;return seed/2147483647},r=(a,b)=>a+(b-a)*rand();function p(pts,color){c.fillStyle=color;c.beginPath();pts.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.closePath();c.fill()}function line(pts,col,l){c.strokeStyle=col;c.lineWidth=l;c.lineJoin='round';c.lineCap='round';c.beginPath();pts.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.stroke()}function ell(x,y,rx,ry,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill()}function box(x,y,a,b,col){c.fillStyle=col;c.fillRect(x,y,a,b)}

}
