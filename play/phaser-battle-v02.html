<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ECLIPSE · Phaser Kampf V0.2</title><style>*{box-sizing:border-box}body{margin:0;background:#101d19;color:#eaf5e9;font:14px system-ui;overflow:hidden}header{height:55px;padding:7px 12px;background:#1a3228;display:flex;justify-content:space-between;align-items:center;gap:12px}strong{color:#c6e9bf}#game{height:calc(100dvh - 123px);touch-action:none}footer{height:68px;background:#1a3228;padding:9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{background:#315e49;color:white;border:1px solid #81ad8e;border-radius:8px;padding:11px;font-weight:700}#msg{font-size:12px;color:#c4d8c5}a{color:#c7e9cc}</style></head><body><header><strong>⚔️ ECLIPSE · PHASER KAMPF</strong><span id="stats">Welle 0 · Leben 20 · Kills 0</span></header><div id="game"></div><footer><button id="start">▶ Welle starten</button><button id="reset">↺ Neustart</button><span id="msg">Krieger verteidigt den Weg automatisch</span></footer><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>(()=>{'use strict';const msg=document.querySelector('#msg'),stats=document.querySelector('#stats');if(!window.Phaser){msg.textContent='Phaser nicht geladen. Internetverbindung prüfen.';return}const W=2400,H=1600,route=[[130,1370],[480,1370],[480,1080],[930,1080],[930,1350],[1500,1350],[1500,920],[1910,920],[1910,560],[1330,560],[1330,280],[2200,280]];let scene,hero,enemies=[],wave=0,lives=20,kills=0,spawning=0,nextSpawn=0,active=false,attackUntil=0,heroDirection='vorne';const warriorAnims={idle:[6,7],run:[8,11],attack:[8,12],hit:[4,8]};function hud(){stats.textContent='Welle '+wave+' · Leben '+lives+' · Kills '+kills}function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}class Battle extends Phaser.Scene{constructor(){super('battle')}preload(){for(const d of ['vorne','hinten','links','rechts'])for(const a in warriorAnims)this.load.spritesheet(d+'_'+a,'../assets/heroes/krieger/level1-v1/sheet_'+d+'_'+a+'.png',{frameWidth:160,frameHeight:160});this.load.on('loaderror',f=>{msg.textContent='Asset-Ladefehler: '+f.key})}create(){scene=this;const g=this.add.graphics();g.fillStyle(0x31543a).fillRect(0,0,W,H);g.lineStyle(110,0x735b42).beginPath();route.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.strokePath();g.lineStyle(83,0xb99a70).beginPath();route.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.strokePath();for(const d of ['vorne','hinten','links','rechts'])for(const [a,[n,fps]]of Object.entries(warriorAnims))this.anims.create({key:d+'_'+a,frames:this.anims.generateFrameNumbers(d+'_'+a,{start:0,end:n-1}),frameRate:fps,repeat:a==='attack'||a==='hit'?0:-1});hero=this.add.sprite(750,960,'vorne_idle').setOrigin(.5,.9).setDepth(10).setScale(1.2);hero.play('vorne_idle');const ring=this.add.circle(hero.x,hero.y-45,190,0x8be6b4,.055).setStrokeStyle(2,0x8be6b4,.3).setDepth(1);this.cameras.main.setBounds(0,0,W,H);this.cameras.main.setZoom(Math.min(this.scale.width/1100,this.scale.height/750));this.cameras.main.centerOn(850,1050);let pointer=null;this.input.on('pointerdown',p=>{pointer={x:p.x,y:p.y}});this.input.on('pointermove',p=>{if(!p.isDown||!pointer)return;const z=this.cameras.main.zoom;this.cameras.main.scrollX-=(p.x-pointer.x)/z;this.cameras.main.scrollY-=(p.y-pointer.y)/z;pointer={x:p.x,y:p.y}});this.input.on('pointerup',()=>pointer=null);msg.textContent='Spielbereit · Kamera mit Finger ziehen'}update(time,delta){if(!active)return;const dt=Math.min(delta,50)/1000;if(spawning>0&&time>=nextSpawn){spawn(this);spawning--;nextSpawn=time+650}for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(!e.alive)continue;const [tx,ty]=route[e.index];const dx=tx-e.x,dy=ty-e.y,dist=Math.hypot(dx,dy),step=e.speed*dt;if(dist<=step){e.x=tx;e.y=ty;e.index++;if(e.index>=route.length){e.alive=false;e.shape.destroy();e.label.destroy();enemies.splice(i,1);lives--;hud();if(lives<=0){active=false;msg.textContent='Niederlage! Neustart drücken.'}continue}}else{e.x+=dx/dist*step;e.y+=dy/dist*step}e.shape.setPosition(e.x,e.y);e.label.setPosition(e.x,e.y-35)}const inRange=enemies.filter(e=>e.alive&&distance(e,{x:hero.x,y:hero.y-55})<190).sort((a,b)=>b.index-a.index);if(inRange.length&&time>=attackUntil){const e=inRange[0];heroDirection=Math.abs(e.x-hero.x)>Math.abs(e.y-hero.y)?e.x>hero.x?'rechts':'links':e.y>hero.y?'vorne':'hinten';hero.play(heroDirection+'_attack',true);attackUntil=time+800;e.hp-=40;this.add.circle(e.x,e.y,32,0xffd66a,.7).setDepth(20);this.time.delayedCall(120,()=>{const effects=this.children.list.filter(o=>o.type==='Arc'&&o.fillColor===0xffd66a);effects.forEach(o=>o.destroy())});if(e.hp<=0){e.alive=false;e.shape.destroy();e.label.destroy();enemies.splice(enemies.indexOf(e),1);kills++;hud()}}else if(time>=attackUntil&&hero.anims.currentAnim?.key!==heroDirection+'_idle')hero.play(heroDirection+'_idle',true);if(spawning===0&&enemies.length===0){active=false;msg.textContent='Welle '+wave+' geschafft! Nächste starten.'}}}function spawn(s){const hp=55+wave*12;const shape=s.add.circle(route[0][0],route[0][1],26,0x86b84c).setStrokeStyle(5,0x35572c).setDepth(6);const label=s.add.text(route[0][0],route[0][1]-35,'Goblin',{font:'bold 15px system-ui',color:'#ffffff'}).setOrigin(.5).setDepth(7);enemies.push({x:route[0][0],y:route[0][1],index:1,hp,speed:110+Math.min(wave*4,60),shape,label,alive:true})}new Phaser.Game({type:Phaser.AUTO,parent:'game',backgroundColor:'#31543a',scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},render:{pixelArt:true,antialias:false},scene:Battle});document.querySelector('#start').onclick=()=>{if(!scene||active||lives<=0)return;wave++;spawning=4+wave*2;nextSpawn=0;active=true;hud();msg.textContent='Welle '+wave+' läuft'};document.querySelector('#reset').onclick=()=>location.reload();})();</script></body></html>
