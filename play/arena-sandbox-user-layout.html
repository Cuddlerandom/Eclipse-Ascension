<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ECLIPSE ASCENSION · Gameplay V0.17 · Krieger-Grafiktest</title><style>*{box-sizing:border-box}body{margin:0;background:#101d19;color:#e9f3e8;font:14px system-ui,sans-serif;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:#172b24}header strong{color:#b7e3b6}#hud{display:flex;gap:12px;flex-wrap:wrap}#viewport{width:100vw;height:calc(100dvh - 110px);display:block;touch-action:none;background:#274935}footer{height:62px;background:#172b24;display:flex;align-items:center;gap:8px;padding:8px;justify-content:space-between}button{background:#3b7055;color:white;border:1px solid #8eb99c;border-radius:8px;padding:10px;font-weight:700}button:disabled{opacity:.4}#message{font-size:12px;color:#c3d7c4;max-width:43vw}#hint{position:absolute;top:58px;left:8px;background:#10231cc9;padding:6px 9px;border-radius:6px;font-size:11px;pointer-events:none}#picker{position:absolute;bottom:70px;left:8px;right:8px;background:#142b23f2;border:1px solid #8eb99c;border-radius:12px;padding:10px;display:none;z-index:5}#picker button{margin:4px;padding:9px;font-size:12px}#picker .close{float:right;background:#6a4843}</style></head><body><header><strong>🌲 ECLIPSE · KRIEGER TEST</strong><div id="hud"><span id="gold"></span><span id="life"></span><span id="wave"></span></div></header><div id="hint">Ziehen: Kamera · 2 Finger: Zoom · Freie Fläche antippen: Held bauen · Held antippen: verbessern</div><canvas id="viewport"></canvas><div id="picker"><b id="pickerTitle">Heldenplatz</b><button class="close" id="close">✕</button><div id="choices"></div></div><footer><button id="start">▶ Welle starten</button><button id="reset">↺ Neustart</button><button id="home">⌖ Kamera</button><span id="message">Heldenplatz auswählen</span></footer><script>
(()=>{'use strict';
const W=2400,H=1600,canvas=document.querySelector('#viewport'),ctx=canvas.getContext('2d');
const $=s=>document.querySelector(s);let vw=0,vh=0,dpr=1,zoom=.48,camX=1200,camY=800;
const route=[[130,1370],[480,1370],[480,1080],[930,1080],[930,1350],[1500,1350],[1500,920],[1910,920],[1910,560],[1330,560],[1330,280],[2200,280]];

// Krieger Level 1: ausschliesslich Original-Sheets; kein Fallback-Sprite.
const warriorArt={};const warriorAnimations={idle:[6,7],run:[8,11],attack:[8,12],hit:[4,8]};
for(const dir of ['vorne','hinten','links','rechts'])for(const anim of Object.keys(warriorAnimations)){const im=new Image();im.src='../assets/sheet_'+dir+'_'+anim+'.png';warriorArt[dir+'_'+anim]=im}
function warriorPose(t){const vx=t.px-(t.spriteLastX??t.px),vy=t.py-(t.spriteLastY??t.py);t.spriteLastX=t.px;t.spriteLastY=t.py;if(Math.abs(vx)+Math.abs(vy)>.2){t.spriteDir=Math.abs(vx)>Math.abs(vy)?vx>0?'rechts':'links':vy>0?'vorne':'hinten'}const anim=gameTime<(t.spriteHitUntil||0)?'hit':gameTime<(t.spriteAttackUntil||0)?'attack':Math.hypot(vx,vy)>.3?'run':'idle';if(t.spriteAnim!==anim){t.spriteAnim=anim;t.spriteAnimStart=gameTime}const [frames,fps]=warriorAnimations[anim],im=warriorArt[(t.spriteDir||'vorne')+'_'+anim];if(!im||!im.complete||!im.naturalWidth)return false;const frame=Math.floor((gameTime-(t.spriteAnimStart||0))*fps)%frames;ctx.imageSmoothingEnabled=false;ctx.drawImage(im,frame*160,0,160,160,t.px-80,t.py-144,160,160);return true}
const classes=[{name:"Krieger",icon:"⚔",color:"#db9e67",cost:100,range:190,attack:40,rate:.8,melee:true,speed:185},{name:"Bogenschütze",icon:"➶",color:"#77b5e8",cost:90,range:300,attack:27,rate:.42,melee:false},{name:"Magier",icon:"✦",color:"#bd8cf1",cost:130,range:245,attack:34,rate:1.05,melee:false,splash:90}];const towers=[];function makeTower(x,y){return {x,y,px:x,py:y,built:false,kind:-1,level:0,priority:0,secondary:0,lockedTarget:null,cd:0,stunnedUntil:0,stunImmuneUntil:0}};const groups=['Standard','Tank','Unterstützung'],priorities=['Erster','Letzter','Stärkster','Schwächster'];const routeLengths=[0];for(let j=1;j<route.length;j++)routeLengths[j]=routeLengths[j-1]+Math.hypot(route[j][0]-route[j-1][0],route[j][1]-route[j-1][1]);function progress(e){return routeLengths[e.seg]+(e.seg<route.length-1?Math.hypot(e.x-route[e.seg][0],e.y-route[e.seg][1]):0)}function enemyGroup(e){return e.type==='schildtraeger'?1:e.type==='bannertraeger'||e.type==='schamane'?2:0}function chooseTarget(t,c){const eligible=enemies.filter(e=>!e.escaped&&e.hp>0&&Math.hypot(e.x-t.x,e.y-t.y)<=c.range);if(!eligible.length)return null;let pool=eligible.filter(e=>enemyGroup(e)===t.priority);if(!pool.length)pool=eligible;pool.sort((a,b)=>t.secondary===1?progress(a)-progress(b):t.secondary===2?b.hp-a.hp:t.secondary===3?a.hp-b.hp:progress(b)-progress(a));return pool[0]}function chooseMeleeTarget(t,c){const valid=e=>e&&!e.escaped&&e.hp>0&&Math.hypot(e.x-t.x,e.y-t.y)<=c.range;const nearby=enemies.filter(valid);if(!nearby.length){t.lockedTarget=null;return null}const strike=nearby.filter(e=>Math.hypot(e.x-t.px,e.y-t.py)<=54);const threat=e=>progress(e);if(strike.length){strike.sort((a,b)=>threat(b)-threat(a));const locked=t.lockedTarget;if(locked&&strike.includes(locked)&&threat(strike[0])-threat(locked)<120)return locked;t.lockedTarget=strike[0];return strike[0]}if(valid(t.lockedTarget)&&Math.hypot(t.lockedTarget.x-t.px,t.lockedTarget.y-t.py)<115)return t.lockedTarget;nearby.sort((a,b)=>{const da=Math.hypot(a.x-t.px,a.y-t.py),db=Math.hypot(b.x-t.px,b.y-t.py);return (da-db)+Math.max(-80,Math.min(80,(threat(a)-threat(b))*.15))});t.lockedTarget=nearby[0];return nearby[0]}const goblins={schamane:{hp:80,speed:70,gold:10,radius:24,color:'#75c7a0',support:true},sprengmeister:{hp:75,speed:95,gold:8,radius:23,color:'#d98546'},bannertraeger:{hp:90,speed:75,gold:6,radius:25,color:'#e4c466',support:true},pluenderer:{hp:100,speed:85,gold:1,radius:25,color:'#8ebc58'},spaeher:{hp:55,speed:155,gold:2,radius:19,color:'#b4e943'},schildtraeger:{hp:220,speed:55,gold:5,radius:30,color:'#658a72',armor:.35}};const buildCostSteps=[0,25,60,105,160];function heroCost(k){const count=towers.filter(t=>t.built&&t.kind===k).length;return classes[k].cost+(buildCostSteps[count]??(160+65*(count-4)))};function waveCount(w){return Math.min(100,Math.round(9+2.5*w+4*Math.sqrt(w)))}function waveHpScale(w){return 1+Math.max(0,w-10)*.035+Math.max(0,w-40)*.012}function waveSpeedScale(w){return 1+Math.min(.3,Math.max(0,w-15)*.004)}const upgradeCosts=[0,0,50,90,150,250];const damageMultipliers=[0,1,1.15,1.15,1.38,1.725];const speedMultipliers=[0,1,1,1.15,1.15,1.15];let gold=150,life=20,wave=0,active=false,spawned=0,spawnTimer=0,enemies=[],shots=[],selected=-1,ended=false,last=performance.now(),gameTime=0,placement=null;function segmentDistance(x,y,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],q=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy)));return Math.hypot(x-(a[0]+q*dx),y-(a[1]+q*dy))}function canPlace(x,y){if(x<60||y<60||x>W-60||y>H-60)return false;for(let i=1;i<route.length;i++)if(segmentDistance(x,y,route[i-1],route[i])<100)return false;return towers.every(t=>!t.built||Math.hypot(t.x-x,t.y-y)>=95)}
function showPicker(i){selected=i;const t=towers[i];$('#pickerTitle').textContent=t.built?classes[t.kind].name+' · Level '+t.level+'/5':'Held an dieser Stelle bauen';if(t.built){const next=t.level+1;$('#choices').innerHTML=(next>5?'<span>Maximallevel 5 erreicht ✓</span>':`<button data-upgrade="1" ${gold<upgradeCosts[next]?'disabled':''}>⬆ Level ${next} · ${upgradeCosts[next]} 🪙</button>`)+`<div style="margin-top:8px">${classes[t.kind].melee?'<div>⚔️ Automatische Nahkampf-KI · Stellung halten</div>':`🎯 Gegnerklasse: <button data-priority="1">${groups[t.priority]} ↻</button><div>Zielauswahl: <button data-secondary="1">${priorities[t.secondary]} ↻</button></div>`}</div>`;}else{$('#choices').innerHTML=classes.map((c,k)=>`<button data-kind="${k}" ${gold<heroCost(k)?'disabled':''}>${c.icon} ${c.name} · ${heroCost(k)} 🪙</button>`).join('')}$('#picker').style.display='block';label()}
$('#choices').onclick=e=>{const b=e.target.closest('button');if(!b||selected<0)return;const t=towers[selected];if(b.hasAttribute('data-priority')){if(!t.built||classes[t.kind].melee)return;t.priority=(t.priority+1)%groups.length}else if(b.hasAttribute('data-secondary')){if(!t.built||classes[t.kind].melee)return;t.secondary=(t.secondary+1)%priorities.length}else if(b.hasAttribute('data-upgrade')){const next=t.level+1;if(!t.built||next>5||gold<upgradeCosts[next])return;gold-=upgradeCosts[next];t.level=next}else if(b.hasAttribute('data-kind')){const k=+b.dataset.kind,c=classes[k];if(t.built||!c||gold<heroCost(k)||!canPlace(t.x,t.y))return;gold-=heroCost(k);t.built=true;t.kind=k;t.level=1;t.priority=0;t.secondary=0;t.lockedTarget=null;t.px=t.x;t.py=t.y;placement=null}else return;showPicker(selected);label()};
$('#close').onclick=()=>{if(placement!==null){towers.splice(placement,1);placement=null;selected=-1}$('#picker').style.display='none';label()};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){dpr=Math.min(devicePixelRatio||1,2);vw=canvas.clientWidth;vh=canvas.clientHeight;canvas.width=Math.round(vw*dpr);canvas.height=Math.round(vh*dpr);draw()}
function clampCam(){camX=Math.max(vw/(2*zoom),Math.min(W-vw/(2*zoom),camX));camY=Math.max(vh/(2*zoom),Math.min(H-vh/(2*zoom),camY));if(vw/zoom>W)camX=W/2;if(vh/zoom>H)camY=H/2}
function screen(x,y){return{x:(x-vw/2)/zoom+camX,y:(y-vh/2)/zoom+camY}}
function label(){ $('#gold').textContent='🪙 '+gold;$('#life').textContent='💚 '+life;$('#wave').textContent='🌊 '+wave;$('#start').disabled=active||ended;$('#message').textContent=ended?(life?'Sieg!':'Verloren!'):selected<0||!towers[selected]?'Freie Fläche antippen':towers[selected].built?classes[towers[selected].kind].name+' Lv.'+towers[selected].level:'Bauplatz gewählt';}
function reset(){gameTime=0;gold=150;life=20;wave=0;active=false;spawned=0;spawnTimer=0;enemies=[];shots=[];selected=-1;ended=false;towers.length=0;placement=null;camX=1200;camY=800;zoom=.48;clampCam();$('#picker').style.display="none";label()}
function start(){if(active||ended)return;if(placement!==null){towers.splice(placement,1);placement=null;$('#picker').style.display='none'}wave++;active=true;spawned=0;spawnTimer=0;selected=-1;label()}
function update(dt){if(ended)return;gameTime+=dt;if(active){spawnTimer-=dt;if(spawned<waveCount(wave)&&spawnTimer<=0){const type=['pluenderer','spaeher','schildtraeger','bannertraeger','sprengmeister','schamane'][spawned%6],g=goblins[type];enemies.push({type,x:route[0][0],y:route[0][1],seg:0,hp:Math.round(g.hp*waveHpScale(wave)),max:Math.round(g.hp*waveHpScale(wave)),speed:g.speed*waveSpeedScale(wave),bombCooldown:0,healCooldown:0});spawned++;spawnTimer=.9}if(spawned>=waveCount(wave)&&!enemies.length){active=false;gold+=20+Math.floor(wave/10)*5;label();if(wave>=100){ended=true;label()}}}
for(const e of enemies){if(e.type==='schamane'&&e.hp>0&&!e.escaped&&gameTime>=e.healCooldown){const wounded=enemies.filter(a=>a!==e&&!a.escaped&&a.hp>0&&a.hp<a.max&&Math.hypot(a.x-e.x,a.y-e.y)<=180);wounded.sort((a,b)=>a.hp/a.max-b.hp/b.max);if(wounded.length){const ally=wounded[0];ally.hp=Math.min(ally.max,ally.hp+30);e.healCooldown=gameTime+5;shots.push({x:e.x,y:e.y,tx:ally.x,ty:ally.y,ttl:.35,color:'#6effaa'})}}if(e.type==='sprengmeister'&&e.hp>0&&!e.escaped&&gameTime>=e.bombCooldown){const ranged=towers.filter(t=>t.built&&!classes[t.kind].melee&&gameTime>=t.stunImmuneUntil&&Math.hypot(t.x-e.x,t.y-e.y)<=180);ranged.sort((a,b)=>Math.hypot(a.x-e.x,a.y-e.y)-Math.hypot(b.x-e.x,b.y-e.y));if(ranged.length){const victim=ranged[0];victim.stunnedUntil=gameTime+2;victim.stunImmuneUntil=gameTime+7;e.bombCooldown=gameTime+12;shots.push({x:e.x,y:e.y,tx:victim.x,ty:victim.y,ttl:.3,color:'#ffbc4e'})}}let boosted=e.type!=='bannertraeger'&&enemies.some(b=>b!==e&&b.type==='bannertraeger'&&!b.escaped&&b.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<=180);let remaining=e.speed*(boosted?1.2:1)*dt;while(remaining>0&&e.seg<route.length-1){const target=route[e.seg+1],d=Math.hypot(target[0]-e.x,target[1]-e.y);if(d<=remaining){e.x=target[0];e.y=target[1];remaining-=d;e.seg++}else{e.x+=(target[0]-e.x)/d*remaining;e.y+=(target[1]-e.y)/d*remaining;remaining=0}}if(e.seg===route.length-1)e.escaped=true}
for(const t of towers){if(!t.built)continue;const c=classes[t.kind];if(gameTime<t.stunnedUntil)continue;let target=c.melee?chooseMeleeTarget(t,c):chooseTarget(t,c);
if(c.melee){let dest=target?target:{x:t.x,y:t.y};let dx=dest.x-t.px,dy=dest.y-t.py,d=Math.hypot(dx,dy);if(d>1){let step=Math.min(d,c.speed*dt);t.px+=dx/d*step;t.py+=dy/d*step}let homeDist=Math.hypot(t.px-t.x,t.py-t.y);if(homeDist>c.range){t.px=t.x+(t.px-t.x)/homeDist*c.range;t.py=t.y+(t.py-t.y)/homeDist*c.range}}
t.cd-=dt;if(!target||t.cd>0)continue;if(c.melee&&Math.hypot(target.x-t.px,target.y-t.py)>48)continue;
const damage=c.attack*damageMultipliers[t.level];target.hp-=damage*(c.name!=='Magier'?(1-(goblins[target.type].armor||0)):1);t.cd=c.rate/speedMultipliers[t.level];if(c.melee)t.spriteAttackUntil=gameTime+8/12;shots.push({x:c.melee?t.px:t.x,y:c.melee?t.py:t.y,tx:target.x,ty:target.y,ttl:.16,color:c.color});
if(c.splash)for(const other of enemies){if(other!==target&&!other.escaped&&Math.hypot(other.x-target.x,other.y-target.y)<c.splash)other.hp-=Math.round(damage*.55)}
}
shots=shots.filter(s=>(s.ttl-=dt)>0);
enemies=enemies.filter(e=>{if(e.escaped){life--;label();return false}if(e.hp<=0){gold+=goblins[e.type].gold;label();return false}return true});
if(life<=0){life=0;ended=true;active=false;label()}}
function draw(){if(!vw||!vh)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,vw,vh);ctx.fillStyle='#172d24';ctx.fillRect(0,0,vw,vh);ctx.save();ctx.translate(vw/2,vh/2);ctx.scale(zoom,zoom);ctx.translate(-camX,-camY);
ctx.fillStyle='#31543a';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff10';ctx.lineWidth=2;for(let x=0;x<=W;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<=H;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();route.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.strokeStyle='#765c42';ctx.lineWidth=105;ctx.stroke();ctx.strokeStyle='#c5a57a';ctx.lineWidth=80;ctx.stroke();
for(let i=0;i<towers.length;i++){const t=towers[i],c=t.built?classes[t.kind]:null;ctx.beginPath();ctx.arc(t.x,t.y,42,0,Math.PI*2);ctx.fillStyle=t.built?'#345d4b':'#233e35';ctx.fill();ctx.strokeStyle=i===selected?'#f6e879':'#a4c5a2';ctx.lineWidth=5;ctx.stroke();if(c){ctx.beginPath();ctx.arc(t.x,t.y,c.range,0,Math.PI*2);ctx.strokeStyle=c.color+'65';ctx.lineWidth=3;ctx.stroke();if(!(c.melee&&warriorPose(t))){ctx.beginPath();ctx.arc(t.px,t.py,27,0,Math.PI*2);ctx.fillStyle=c.color;ctx.fill();ctx.fillStyle='#17251e';ctx.font='bold 32px system-ui';ctx.textAlign='center';ctx.fillText(c.icon,t.px,t.py+10);}ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.fillText('Lv.'+t.level,t.px,t.py+48);if(gameTime<t.stunnedUntil){ctx.fillStyle='#ffd45c';ctx.font='bold 34px system-ui';ctx.fillText('✦',t.px,t.py-35)}}else{ctx.fillStyle='#fff';ctx.font='bold 30px system-ui';ctx.textAlign='center';ctx.fillText('+',t.x,t.y+11)}}
for(const e of enemies){ctx.beginPath();ctx.arc(e.x,e.y,goblins[e.type].radius,0,Math.PI*2);ctx.fillStyle=goblins[e.type].color;ctx.fill();ctx.fillStyle='#29452d';ctx.beginPath();ctx.arc(e.x-8,e.y-4,3,0,Math.PI*2);ctx.arc(e.x+8,e.y-4,3,0,Math.PI*2);ctx.fill();if(e.type==='schildtraeger'){ctx.strokeStyle='#d1d9b0';ctx.lineWidth=6;ctx.beginPath();ctx.arc(e.x,e.y,18,-.5,Math.PI+.5);ctx.stroke()}if(e.type==='schamane'){ctx.strokeStyle='#92ffbc';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(e.x+18,e.y+18);ctx.lineTo(e.x+18,e.y-28);ctx.stroke();ctx.fillStyle='#a4ffbc';ctx.beginPath();ctx.arc(e.x+18,e.y-32,8,0,Math.PI*2);ctx.fill()}if(e.type==='sprengmeister'){ctx.fillStyle='#382d22';ctx.fillRect(e.x-11,e.y-28,22,19);ctx.fillStyle='#ffcb58';ctx.fillRect(e.x-4,e.y-34,8,8)}if(e.type==='bannertraeger'){ctx.strokeStyle='#f7f2cb';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(e.x+18,e.y+14);ctx.lineTo(e.x+18,e.y-45);ctx.stroke();ctx.fillStyle='#df5e4c';ctx.fillRect(e.x+18,e.y-45,28,19)}ctx.fillStyle='#1c2620';ctx.fillRect(e.x-28,e.y-40,56,8);ctx.fillStyle='#8ee18d';ctx.fillRect(e.x-28,e.y-40,56*Math.max(0,e.hp/e.max),8)}
for(const s of shots){ctx.strokeStyle=s.color||'#b2eaff';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.tx,s.ty);ctx.stroke()}
for(const [i,p] of [[0,route[0]],[1,route[route.length-1]]]){ctx.beginPath();ctx.arc(p[0],p[1],55,0,Math.PI*2);ctx.fillStyle=i?'#64c7a2':'#6e5140';ctx.fill();ctx.strokeStyle='#e9ebc8';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 26px system-ui';ctx.textAlign='center';ctx.fillText(i?'ZIEL':'START',p[0],p[1]+9)}
ctx.restore()}
let pointers=new Map(),moved=false,down=null,lastPinch=0;
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const p=pos(e);pointers.set(e.pointerId,p);down=p;moved=false;lastPinch=0});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=pos(e),old=pointers.get(e.pointerId);pointers.set(e.pointerId,p);if(pointers.size===1){if(Math.hypot(p.x-down.x,p.y-down.y)>7)moved=true;camX-=(p.x-old.x)/zoom;camY-=(p.y-old.y)/zoom;clampCam()}else if(pointers.size===2){moved=true;const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastPinch)zoom=Math.max(.32,Math.min(1.8,zoom*d/lastPinch));lastPinch=d;clampCam()}});
canvas.addEventListener('pointerup',e=>{const p=pos(e);if(!moved&&pointers.size===1&&!ended){const w=screen(p.x,p.y);const i=towers.findIndex(t=>t.built&&dist(t,w)<Math.max(45,32/zoom));if(i>=0){if(placement!==null){towers.splice(placement,1);placement=null}showPicker(i)}else{if(placement!==null){towers.splice(placement,1);placement=null}if(canPlace(w.x,w.y)){towers.push(makeTower(w.x,w.y));placement=towers.length-1;showPicker(placement)}else{$('#message').textContent='⛔ Hier ist kein Platz für einen Helden';$('#picker').style.display='none'}}}pointers.delete(e.pointerId);lastPinch=0});
canvas.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.32,Math.min(1.8,zoom*(e.deltaY>0?.9:1.1)));clampCam()},{passive:false});
$('#start').onclick=start;$('#reset').onclick=reset;$('#home').onclick=()=>{camX=1200;camY=800;zoom=.48;clampCam()};
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}
window.addEventListener('resize',resize);resize();reset();requestAnimationFrame(frame);
})();</script></body></html>
