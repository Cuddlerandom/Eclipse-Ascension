<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ECLIPSE ASCENSION · Gameplay V0.1</title><style>*{box-sizing:border-box}body{margin:0;background:#101d19;color:#e9f3e8;font:14px system-ui,sans-serif;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:#172b24}header strong{color:#b7e3b6}#hud{display:flex;gap:12px;flex-wrap:wrap}#viewport{width:100vw;height:calc(100dvh - 110px);display:block;touch-action:none;background:#274935}footer{height:62px;background:#172b24;display:flex;align-items:center;gap:8px;padding:8px;justify-content:space-between}button{background:#3b7055;color:white;border:1px solid #8eb99c;border-radius:8px;padding:10px;font-weight:700}button:disabled{opacity:.4}#message{font-size:12px;color:#c3d7c4;max-width:43vw}#hint{position:absolute;top:58px;left:8px;background:#10231cc9;padding:6px 9px;border-radius:6px;font-size:11px;pointer-events:none}</style></head><body><header><strong>🌲 ECLIPSE V0.1</strong><div id="hud"><span id="gold"></span><span id="life"></span><span id="wave"></span></div></header><div id="hint">Ziehen: Kamera · 2 Finger: Zoom · Bauplatz antippen: Turm</div><canvas id="viewport"></canvas><footer><button id="start">▶ Welle starten</button><button id="reset">↺ Neustart</button><button id="home">⌖ Kamera</button><span id="message">Turmplatz auswählen</span></footer><script>
(()=>{'use strict';
const W=2400,H=1600,canvas=document.querySelector('#viewport'),ctx=canvas.getContext('2d');
const $=s=>document.querySelector(s);let vw=0,vh=0,dpr=1,zoom=.48,camX=1200,camY=800;
const route=[[130,1370],[480,1370],[480,1080],[930,1080],[930,1350],[1500,1350],[1500,920],[1910,920],[1910,560],[1330,560],[1330,280],[2200,280]];
const spots=[[310,1200],[630,1250],[740,930],[1090,1210],[1250,1460],[1630,1190],[1780,780],[2050,740],[1770,430],[1450,730],[1150,400],[1800,150]];
const towers=spots.map(([x,y])=>({x,y,built:false,cd:0}));let gold=180,life=20,wave=0,active=false,spawned=0,spawnTimer=0,enemies=[],shots=[],selected=-1,ended=false,last=performance.now();
const towerCost=60;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){dpr=Math.min(devicePixelRatio||1,2);vw=canvas.clientWidth;vh=canvas.clientHeight;canvas.width=Math.round(vw*dpr);canvas.height=Math.round(vh*dpr);draw()}
function clampCam(){camX=Math.max(vw/(2*zoom),Math.min(W-vw/(2*zoom),camX));camY=Math.max(vh/(2*zoom),Math.min(H-vh/(2*zoom),camY));if(vw/zoom>W)camX=W/2;if(vh/zoom>H)camY=H/2}
function screen(x,y){return{x:(x-vw/2)/zoom+camX,y:(y-vh/2)/zoom+camY}}
function label(){ $('#gold').textContent='🪙 '+gold;$('#life').textContent='💚 '+life;$('#wave').textContent='🌊 '+wave;$('#start').disabled=active||ended;$('#message').textContent=ended?(life?'Sieg!':'Verloren!'):selected<0?'Bauplatz auswählen':towers[selected].built?'Turm bereits gebaut':gold<towerCost?'Zu wenig Gold':'Bauplatz: 60 Gold';}
function reset(){gold=180;life=20;wave=0;active=false;spawned=0;spawnTimer=0;enemies=[];shots=[];selected=-1;ended=false;towers.forEach(t=>{t.built=false;t.cd=0});camX=1200;camY=800;zoom=.48;clampCam();label()}
function start(){if(active||ended)return;wave++;active=true;spawned=0;spawnTimer=0;selected=-1;label()}
function update(dt){if(ended)return;if(active){spawnTimer-=dt;if(spawned<6+wave*3&&spawnTimer<=0){enemies.push({x:route[0][0],y:route[0][1],seg:0,hp:70+wave*20,max:70+wave*20,speed:80+wave*4});spawned++;spawnTimer=.9}if(spawned>=6+wave*3&&!enemies.length){active=false;gold+=35;label();if(wave>=5){ended=true;label()}}}
for(const e of enemies){let remaining=e.speed*dt;while(remaining>0&&e.seg<route.length-1){const target=route[e.seg+1],d=Math.hypot(target[0]-e.x,target[1]-e.y);if(d<=remaining){e.x=target[0];e.y=target[1];remaining-=d;e.seg++}else{e.x+=(target[0]-e.x)/d*remaining;e.y+=(target[1]-e.y)/d*remaining;remaining=0}}if(e.seg===route.length-1)e.escaped=true}
for(const t of towers){if(!t.built)continue;t.cd-=dt;if(t.cd>0)continue;const target=enemies.find(e=>!e.escaped&&e.hp>0&&dist(t,e)<225);if(target){target.hp-=32;t.cd=.55;shots.push({x:t.x,y:t.y,tx:target.x,ty:target.y,ttl:.16})}}
shots=shots.filter(s=>(s.ttl-=dt)>0);
enemies=enemies.filter(e=>{if(e.escaped){life--;label();return false}if(e.hp<=0){gold+=15;label();return false}return true});
if(life<=0){life=0;ended=true;active=false;label()}}
function draw(){if(!vw||!vh)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,vw,vh);ctx.fillStyle='#172d24';ctx.fillRect(0,0,vw,vh);ctx.save();ctx.translate(vw/2,vh/2);ctx.scale(zoom,zoom);ctx.translate(-camX,-camY);
ctx.fillStyle='#31543a';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff10';ctx.lineWidth=2;for(let x=0;x<=W;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<=H;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();route.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.strokeStyle='#765c42';ctx.lineWidth=105;ctx.stroke();ctx.strokeStyle='#c5a57a';ctx.lineWidth=80;ctx.stroke();
for(let i=0;i<towers.length;i++){const t=towers[i];ctx.beginPath();ctx.arc(t.x,t.y,42,0,Math.PI*2);ctx.fillStyle=t.built?'#577fc5':'#233e35';ctx.fill();ctx.strokeStyle=i===selected?'#f6e879':'#a4c5a2';ctx.lineWidth=5;ctx.stroke();if(t.built){ctx.beginPath();ctx.arc(t.x,t.y,225,0,Math.PI*2);ctx.strokeStyle='#7cbaff35';ctx.lineWidth=3;ctx.stroke()}ctx.fillStyle='#fff';ctx.font='bold 30px system-ui';ctx.textAlign='center';ctx.fillText(t.built?'⚔':'+' ,t.x,t.y+11)}
for(const e of enemies){ctx.beginPath();ctx.arc(e.x,e.y,25,0,Math.PI*2);ctx.fillStyle='#ce6a55';ctx.fill();ctx.fillStyle='#1c2620';ctx.fillRect(e.x-28,e.y-40,56,8);ctx.fillStyle='#8ee18d';ctx.fillRect(e.x-28,e.y-40,56*Math.max(0,e.hp/e.max),8)}
for(const s of shots){ctx.strokeStyle='#b2eaff';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.tx,s.ty);ctx.stroke()}
for(const [i,p] of [[0,route[0]],[1,route[route.length-1]]]){ctx.beginPath();ctx.arc(p[0],p[1],55,0,Math.PI*2);ctx.fillStyle=i?'#64c7a2':'#6e5140';ctx.fill();ctx.strokeStyle='#e9ebc8';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 26px system-ui';ctx.textAlign='center';ctx.fillText(i?'ZIEL':'START',p[0],p[1]+9)}
ctx.restore()}
let pointers=new Map(),moved=false,down=null,lastPinch=0;
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const p=pos(e);pointers.set(e.pointerId,p);down=p;moved=false;lastPinch=0});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=pos(e),old=pointers.get(e.pointerId);pointers.set(e.pointerId,p);if(pointers.size===1){if(Math.hypot(p.x-down.x,p.y-down.y)>7)moved=true;camX-=(p.x-old.x)/zoom;camY-=(p.y-old.y)/zoom;clampCam()}else if(pointers.size===2){moved=true;const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastPinch)zoom=Math.max(.32,Math.min(1.8,zoom*d/lastPinch));lastPinch=d;clampCam()}});
canvas.addEventListener('pointerup',e=>{const p=pos(e);if(!moved&&pointers.size===1&&!ended){const w=screen(p.x,p.y);const i=towers.findIndex(t=>dist(t,w)<70/zoom**.15);if(i>=0){selected=i;const t=towers[i];if(!t.built&&gold>=towerCost){gold-=towerCost;t.built=true}label()}}pointers.delete(e.pointerId);lastPinch=0});
canvas.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.32,Math.min(1.8,zoom*(e.deltaY>0?.9:1.1)));clampCam()},{passive:false});
$('#start').onclick=start;$('#reset').onclick=reset;$('#home').onclick=()=>{camX=1200;camY=800;zoom=.48;clampCam()};
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}
window.addEventListener('resize',resize);resize();reset();requestAnimationFrame(frame);
})();</script></body></html>
