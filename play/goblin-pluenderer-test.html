<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECLIPSE – Goblin-Plünderer Test</title><style>body{margin:0;background:#193b2d;color:#fff;font:15px system-ui;text-align:center}header{padding:16px}canvas{width:min(96vw,700px);height:340px;background:radial-gradient(ellipse at 50% 80%,#44784b,#183629);image-rendering:pixelated;border:2px solid #7aab72;border-radius:12px}button,select{background:#28573b;color:white;border:1px solid #a8c29b;padding:11px;margin:5px;border-radius:8px;font-size:15px}#status{padding:10px}small{display:block;padding:8px}</style></head><body><header><h2>ECLIPSE · Goblin-Plünderer V1.0</h2><div>Isolierter Animationstest · Original-ZIP aus GitHub</div></header><div id="status">Lade Sprite-Sheets…</div><canvas id="view" width="700" height="340"></canvas><div><select id="anim"><option value="laufen">Laufen</option><option value="idle">Idle</option><option value="umschauen">Umschauen</option><option value="dolchfuchteln">Dolchfuchteln</option><option value="getroffen">Getroffen</option><option value="sterben">Sterben</option></select><select id="dir"><option value="0">Unten</option><option value="1">Oben</option><option value="2">Links</option><option value="3">Rechts</option></select></div><small>Technischer Test – keine künstlerische Freigabe</small><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const cv=document.getElementById('view'),ctx=cv.getContext('2d'),status=document.getElementById('status'),anim=document.getElementById('anim'),dir=document.getElementById('dir');let images={},tick=0;ctx.imageSmoothingEnabled=false;
async function load(){try{if(!window.JSZip)throw Error('ZIP-Bibliothek konnte nicht geladen werden');let r=await fetch('../assets/Goblin_Pluenderer_V1.0_Produktionskandidat.zip');if(!r.ok)throw Error('GitHub-ZIP: HTTP '+r.status);let z=await JSZip.loadAsync(await r.arrayBuffer());for(let a of ['idle','laufen','umschauen','dolchfuchteln','getroffen','sterben']){let f=z.file('sheet_'+a+'.png');if(!f)throw Error('Sprite-Sheet fehlt: '+a);let blob=await f.async('blob'),url=URL.createObjectURL(new Blob([blob],{type:'image/png'})),im=new Image();await new Promise((res,rej)=>{im.onload=res;im.onerror=rej;im.src=url});images[a]=im;}status.textContent='✓ Alle 6 Sprite-Sheets geladen – Animation läuft';}catch(e){status.textContent='Fehler: '+e.message;}}
function draw(t){ctx.clearRect(0,0,700,340);ctx.fillStyle='#5b7849';ctx.fillRect(0,278,700,62);ctx.fillStyle='#a9bd8c';ctx.fillRect(0,278,700,3);let a=anim.value,im=images[a];if(im){let frame=Math.floor(t/190)%4,row=Number(dir.value);ctx.drawImage(im,frame*128,row*128,128,128,254,65,192,192);ctx.fillStyle='#fff';ctx.font='16px system-ui';ctx.fillText(a+' · '+['unten','oben','links','rechts'][row]+' · Frame '+(frame+1)+'/4',18,30)}requestAnimationFrame(draw)}requestAnimationFrame(draw);load();</script></body></html>
