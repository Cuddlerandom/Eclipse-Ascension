t und tippe auf die Wiese</small></div><div class="tip">🌙 Der Runenbaum muss überleben<br><span id="waveinfo">10-Wellen-Technikdemo</span></div><div class="bar"><button id="build" class="sel">🏹 Waldläufer · 65</button><button id="wave">⚔ Welle starten</button><button id="speed">⏩ 1×</button><button id="pause">⏸ Pause</button><button id="fx">✨ Magie</button></div><div class="overlay" id="over"><h1 id="endtitle"></h1><p id="endsub"></p><button onclick="location.reload()">↻ Erneut spielen</button></div><script src="https://cdn.babylonjs.com/babylon.js"></script><script>
const canvas=document.getElementById('c'),engine=new BABYLON.Engine(canvas,true,{adaptToDeviceRatio:true});engine.setHardwareScalingLevel(Math.max(1,devicePixelRatio/1.7));const S=new BABYLON.Scene(engine),V=BABYLON.Vector3;S.clearColor=new BABYLON.Color4(.62,.8,.75,1);S.fogMode=BABYLON.Scene.FOGMODE_EXP2;S.fogDensity=.008;S.fogColor=new BABYLON.Color3(.62,.8,.75);const cam=new BABYLON.ArcRotateCamera('locked iso',-Math.PI/2,1.05,40,new V(0,0,0),S);cam.mode=BABYLON.Camera.ORTHOGRAPHIC_CAMERA;cam.inputs.clear();function fit(){engine.resize();const a=engine.getRenderWidth()/engine.getRenderHeight();const halfH=Math.max(12,19/a);cam.orthoTop=halfH;cam.orthoBottom=-halfH;cam.orthoLeft=-halfH*a;cam.orthoRight=halfH*a}fit();const sky=new BABYLON.HemisphericLight('warm daylight',new V(0,1,0),S);sky.intensity=1.08;const sun=new BABYLON.DirectionalLight('sun',new V(-.7,-1,-.4),S);sun.intensity=.8;function mat(n,c,e){let m=new BABYLON.StandardMaterial(n,S);m.diffuseColor=BABYLON.Color3.FromHexString(c);if(e)m.emissiveColor=BABYLON.Color3.FromHexString(e);return m}const M={grass:mat('emerald meadow','#60984f'),grass2:mat('soft moss','#447b45'),dirt:mat('warm earth','#b99b6c'),edge:mat('soil edge','#8c7951'),wood:mat('weathered bark','#62432e'),wood2:mat('light bark','#96714a'),leaf:mat('emerald leaves','#347b48'),leaf2:mat('sunlit leaves','#62ac62'),leaf3:mat('forest canopy','#246346'),stone:mat('mossy stones','#718471'),moss:mat('moss','#4e9458'),dark:mat('cave shadow','#0c1715'),water:mat('turquoise brook','#4bafb4','#125458'),rune:mat('runic turquoise','#73e9d5','#25c6b8'),mush:mat('glowing mushrooms','#9af3e6','#2bada2'),gold:mat('golden glow','#f3d48a','#a77e2c'),gob:mat('olive goblin','#819b45'),leather:mat('goblin leather','#785337'),blade:mat('daggers','#bbc8c4'),blue:mat('ranger blue','#35677c'),skin:mat('ranger skin','#c6a17a'),red:mat('damage','#d45643'),petal:mat('wildflowers','#f5dcb2')};function sphere(n,x,y,z,sx,sy,sz,m,seg=9){let o=BABYLON.MeshBuilder.CreateSphere(n,{diameter:1,segments:seg},S);o.position.set(x,y,z);o.scaling.set(sx,sy,sz);o.material=m;o.isPickable=false;return o}function cylinder(n,x,y,z,d,h,m,t=9){let o=BABYLON.MeshBuilder.CreateCylinder(n,{diameter:d,height:h,tessellation:t},S);o.position.set(x,y,z);o.material=m;o.isPickable=false;return o}function box(n,x,y,z,w,h,d,m){let o=BABYLON.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},S);o.position.set(x,y,z);o.material=m;o.isPickable=false;return o}const terrain=BABYLON.MeshBuilder.CreateGround('meadow',{width:34,height:22},S);terrain.material=M.grass;terrain.isPickable=true;for(let i=0;i<35;i++){let x=-19+i*1.2;sphere('soft perimeter hills',x,-.9,-11.2,2.9,2.1,2.9,M.grass2);sphere('forest ridge',x,-1,11.5,2.9,2.4,2.9,M.grass2)}
const raw=[[-13,-5.5],[-9,-5.5],[-4,-5.5],[1,-5.5],[6,-5.5],[9,-4.8],[10,-3],[9,-1.1],[5,-1.1],[0,-1.1],[-5,-1.1],[-9,-1.1],[-10,1],[-9,3.7],[-4,3.7],[1,3.7],[6,3.7],[11.4,3.7]];const path=BABYLON.Curve3.CreateCatmullRomSpline(raw.map(a=>new V(a[0],.08,a[1])),14,false).getPoints();const lengths=[0];for(let i=1;i<path.length;i++)lengths.push(lengths.at(-1)+V.Distance(path[i-1],path[i]));const total=lengths.at(-1);function at(d){d=Math.max(0,Math.min(total,d));let i=1;while(i<lengths.length-1&&lengths[i]<d)i++;return V.Lerp(path[i-1],path[i],(d-lengths[i-1])/Math.max(.001,lengths[i]-lengths[i-1]))}function nearRoad(x,z){let m=100;for(let i=0;i<path.length;i+=2)m=Math.min(m,Math.hypot(x-path[i].x,z-path[i].z));return m}for(let i=1;i<path.length;i++){let a=path[i-1],b=path[i],dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz),ang=Math.atan2(dx,dz);let rim=box('road margin',(a.x+b.x)/2,.023,(a.z+b.z)/2,1.82,.055,len+.16,M.edge);rim.rotation.y=ang;let road=box('continuous earth road',(a.x+b.x)/2,.063,(a.z+b.z)/2,1.57,.057,len+.13,M.dirt);road.rotation.y=ang}
let sway=[];function forestTree(x,z,s=1,hero=false){let trunk=cylinder('curved tree trunk',x,s*1.15,z,.42*s,2.3*s,M.wood,10);trunk.rotation.z=.11;let crown=sphere('lush fantasy canopy',x-.2*s,2.5*s,z,2.25*s,1.8*s,2*s,hero?M.leaf2:M.leaf,12);let cl=sphere('leaf cluster',x+.55*s,2.75*s,z-.28*s,1.3*s,1.15*s,1.25*s,hero?M.leaf:M.leaf2,10);sway.push({mesh:cl,phase:x+z});if(hero){for(let i=0;i<11;i++){let a=i*2*Math.PI/11;cylinder('tree glowing rune',x+Math.cos(a)*.55*s,1.0*s+(i%5)*.32*s,z+Math.sin(a)*.55*s,.11*s,.23*s,M.rune)}for(let i=0;i<7;i++){let a=i*Math.PI*2/7;let r=cylinder('ancient roots',x+Math.cos(a)*1.25*s,.12,z+Math.sin(a)*1.25*s,.18*s,1.2*s,M.wood);r.rotation.z=Math.PI/2}}}
for(let i=0;i<43;i++){let x=-17+(i*7.73)%34,z=-10+(i*5.31)%20;if(nearRoad(x,z)<2.8||x>8&&z>1||x< -10&&z< -3||x< -8&&z>6)continue;forestTree(x,z,.4+(i%4)*.13)}
sphere('moss-covered cave hill',-14,1,-5.5,4.8,3.2,4.5,M.stone);sphere('cave mouth',-13.1,.8,-5.4,1.3,1.7,1.7,M.dark);for(let i=0;i<5;i++){let p=box('crooked goblin poles',-14.4+i*.3,.55,-7,.13,1.3,.13,M.wood);p.rotation.z=.2*Math.sin(i*2)}box('tattered tribal banner',-14.2,1.45,-7,.8,.48,.07,M.leather);
forestTree(12,3.7,2.0,true);sphere('world tree hill',12,-.6,3.7,5.3,1.3,4.5,M.grass2);
for(let i=0;i<23;i++){let x=-16+i*.34,z=8.15+Math.sin(i*.35)*.34;box('sparkling woodland brook',x,.075,z,.49,.04,.65,M.water)}for(let i=0;i<8;i++)box('arched bridge planks',-12.8+i*.29,.22+Math.sin(i/7*Math.PI)*.15,8.1,.28,.11,2.0,M.wood2);for(let z of [7.05,9.12])box('low bridge rail',-11.75,.55,z,2.55,.13,.13,M.wood);
const mushrooms=[];for(let i=0;i<68;i++){let x=-16+(i*5.17)%32,z=-9.7+(i*7.11)%19.4;if(nearRoad(x,z)<1.15||Math.hypot(x-12,z-3.7)<2.4)continue;if(i%4===0){let b=sphere('mossy boulder',x,.15,z,.55,.4,.5,M.stone);sphere('rock moss',x,.36,z,.4,.1,.3,M.moss)}else if(i%3===0){let s=sphere('magic mushroom',x,.16,z,.18,.2,.18,M.mush);mushrooms.push(s)}else{sphere('small flower',x,.1,z,.1,.16,.1,i%2?M.petal:M.leaf2)}}
const particles=[];for(let i=0;i<24;i++){let p=sphere('firefly',-15+(i*3.97)%30,.7+(i%4)*.36,-9+(i*5.33)%18,.075,.075,.075,i%3?M.mush:M.gold);particles.push({p,seed:i})}
function goblin(){let root=new BABYLON.TransformNode('animated goblin raider',S);function child(o){o.parent=root;return o}child(sphere('leather tunic',0,.54,0,.5,.62,.38,M.leather));child(sphere('goblin face',0,1.1,.09,.58,.5,.52,M.gob));for(let s of [-1,1]){let ear=child(sphere('pointed ear',s*.42,1.16,.1,.31,.17,.19,M.gob));ear.rotation.z=s*.35;child(sphere('sly eye',s*.2,1.2,.53,.08,.06,.04,M.dark));child(sphere('arm',s*.38,.51,.05,.19,.42,.18,M.gob));child(cylinder('short dagger',s*.5,.22,.1,.1,.38,M.blade));child(sphere('boot',s*.19,.13,.1,.2,.23,.3,M.leather))}return root}
let hp=20,gold=180,wave=0,active=false,remaining=0,spawnClock=0,speed=1,paused=false,building=true,finished=false,enemies=[],towers=[],bolts=[],time=0,magic=0;const el=id=>document.getElementById(id);function say(t){el('hint').textContent=t}function ui(){el('stats').textContent='❤ '+hp+'     ✦ '+gold+' Gold     ⚔ Welle '+wave+'/10'}function finish(won){finished=true;el('over').style.display='flex';el('endtitle').textContent=won?'✧ Der Smaragdwald lebt!':'Der Weltenbaum ist gefallen';el('endsub').textContent='Technikdemo · Welle '+wave+' von 10'}function createEnemy(){let root=goblin();enemies.push({root,d:0,hp:35+wave*12,speed:1.45+wave*.07,phase:Math.random()*6,reward:12+wave})}function start(){if(active||finished)return;if(wave>=10)return finish(true);wave++;remaining=5+wave*2;spawnClock=.15;active=true;say('Goblinwelle '+wave+' greift an!');ui()}function build(x,z){if(gold<65)return say('Zu wenig Gold');if(Math.abs(x)>15.6||Math.abs(z)>9.7||nearRoad(x,z)<1.6||Math.hypot(x-12,z-3.7)<2.7||Math.hypot(x+13,z+5.5)<2.7||z>7.3&&x< -8||towers.some(t=>Math.hypot(t.x-x,t.z-z)<1.2))return say('Hier ist das Gelände gesperrt');gold-=65;cylinder('ranger pedestal',x,.15,z,.85,.3,M.wood2);sphere('ranger cloak',x,.69,z,.56,.82,.46,M.blue);sphere('ranger head',x,1.24,z,.35,.36,.35,M.skin);box('longbow',x+.4,.8,z,.08,.9,.08,M.wood);towers.push({x,z,cd:0});say('Waldläufer bereit!');ui()}S.onPointerDown=e=>{if(!building||finished||e.button===2)return;let ray=S.createPickingRay(S.pointerX,S.pointerY,BABYLON.Matrix.Identity(),cam);let p=S.pickWithRay(ray,m=>m===terrain);if(p.hit)build(p.pickedPoint.x,p.pickedPoint.z)};el('build').onclick=()=>{building=!building;el('build').classList.toggle('sel',building);say(building?'Tippe auf eine freie Wiese':'Baumodus ausgeschaltet')};el('wave').onclick=start;el('speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;el('speed').textContent='⏩ '+speed+'×'};el('pause').onclick=()=>{paused=!paused;el('pause').textContent=paused?'▶ Weiter':'⏸ Pause'};el('fx').onclick=()=>{magic=4;say('Die Magie des Weltenbaums erwacht!')};S.onBeforeRenderObservable.add(()=>{let real=Math.min(.05,engine.getDeltaTime()/1000);time+=real;for(let s of sway)s.mesh.rotation.z=Math.sin(time*.7+s.phase)*.025;for(let o of particles){o.p.position.y=.75+(o.seed%4)*.32+Math.sin(time*1.7+o.seed)*.12;o.p.visibility=.65+.3*Math.sin(time*2+o.seed)}if(magic>0){magic-=real;M.rune.emissiveColor=new BABYLON.Color3(.3+magic*.08,.8,.75)}else M.rune.emissiveColor=new BABYLON.Color3(.1,.55,.49);if(paused||finished)return;let dt=real*speed;if(active&&remaining>0){spawnClock-=dt;if(spawnClock<=0){createEnemy();remaining--;spawnClock=Math.max(.36,1.1-wave*.04)}}for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.d+=e.speed*dt;let p=at(e.d),q=at(e.d+.1);e.root.position.set(p.x,.08+Math.abs(Math.sin(time*9+e.phase))*.07,p.z);e.root.rotation.y=Math.atan2(q.x-p.x,q.z-p.z);if(e.d>=total){e.root.dispose(false,true);enemies.splice(i,1);hp--;ui();if(hp<=0)return finish(false)}}for(let t of towers){t.cd-=dt;if(t.cd>0)continue;let target=null,best=4.1;for(let e of enemies){let d=Math.hypot(t.x-e.root.position.x,t.z-e.root.position.z);if(d<best){best=d;target=e}}if(!target)continue;t.cd=.64;target.hp-=23;let p=sphere('ranger arrow',t.x,1.1,t.z,.17,.17,.17,M.gold);bolts.push({mesh:p,target,life:.22});if(target.hp<=0){gold+=target.reward;target.root.dispose(false,true);enemies.splice(enemies.indexOf(target),1);ui()}}for(let i=bolts.length-1;i>=0;i--){let b=bolts[i];b.life-=dt;if(b.life<=0||b.target.root.isDisposed()){b.mesh.dispose();bolts.splice(i,1)}else b.mesh.position=V.Lerp(b.mesh.position,b.target.root.position.add(new V(0,.8,0)),Math.min(1,dt*16))}if(active&&!remaining&&!enemies.length){active=false;gold+=30+wave*3;say('Welle '+wave+' überstanden! Bonusgold erhalten');ui();if(wave>=10)finish(true)}});ui();engine.runRenderLoop(()=>S.render());addEventListener('resize',fit);
</script></body></html>
