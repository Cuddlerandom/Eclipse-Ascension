name: Phaser combat regression tests
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'play/phaser/src/combat/**'
      - 'play/phaser/src/scenes/WorldScene.js'
      - 'play/phaser/tests/**'
      - '.github/workflows/phaser-combat-tests.yml'
  workflow_dispatch:
jobs:
  combat-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check play/phaser/src/scenes/WorldScene.js
          node --check play/phaser/src/combat/CombatCore.js
          node --check play/phaser/src/combat/GoblinAbilities.js
          node --check play/phaser/src/combat/WaveConfig.js
          node --check play/phaser/src/combat/Economy.js
          node --check play/phaser/src/combat/EnemyBalance.js
          node --check play/phaser/src/combat/BossMechanics.js
          node --check play/phaser/src/combat/WarriorBehavior.js
          node --check play/phaser/src/combat/WarriorAbilities.js
      - name: Combat target, damage and cooldown tests
        run: node play/phaser/tests/combat-core.test.mjs
      - name: Goblin ability tests
        run: node play/phaser/tests/goblin-abilities.test.mjs
      - name: Wave composition tests
        run: node play/phaser/tests/wave-config.test.mjs
      - name: Economy tests
        run: node play/phaser/tests/economy.test.mjs
      - name: Enemy health thresholds
        run: node play/phaser/tests/enemy-balance.test.mjs
      - name: Warrior behaviour tests
        run: node play/phaser/tests/warrior-behavior.test.mjs
      - name: Warrior ability tests
        run: node play/phaser/tests/warrior-abilities.test.mjs
      - name: Boss mechanics tests
        run: node play/phaser/tests/boss-mechanics.test.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run Chromium gameplay smoke test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/eclipse-server.log 2>&1 &
          node play/phaser/tests/browser-smoke.mjs
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phaser-combat-browser-screenshot
          path: phaser-combat-smoke.png
          if-no-files-found: ignore
