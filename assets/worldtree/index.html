<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ECLIPSE — Weltenbaum 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0b1e19;color:#f4ebd2;font:14px system-ui}canvas{width:100%;height:100%;display:block;touch-action:none}.ui{position:fixed;top:12px;left:12px;background:#0c2b22e8;border:1px solid #b2d5ae80;border-radius:12px;padding:12px;pointer-events:none}.ui b{font:20px Georgia,serif;color:#d5e9b2}.ui small{display:block;color:#c1dfd4}.bar{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:50%;transform:translateX(-50%);display:flex;gap:8px;background:#0b2c24e8;padding:8px;border-radius:13px}button{background:#2a624b;border:1px solid #8ec2aa;color:white;border-radius:9px;padding:11px;font:13px system-ui}.err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#171d1b;color:white;padding:25px}</style></head><body><canvas id="scene"></canvas><div class="ui"><b>✧ DER WELTENBAUM</b><small>ECLIPSE: ASCENSION · Echtes 3D-Modell V1</small><small>Mit einem Finger drehen · Mit zwei Fingern zoomen</small></div><div class="bar"><button id="spin">⟳ Drehen: An</button><button id="reset">↺ Ansicht</button><button id="runes">✧ Runen: An</button></div><div class="err" id="error"></div><script src="https://cdn.babylonjs.com/babylon.js"></script><script type="module">
import {createWorldTree} from './worldtree.js';
try{
const B=window.BABYLON,cv=document.getElementById('scene'),engine=new B.Engine(cv,true,{adaptToDeviceRatio:true});engine.setHardwareScalingLevel(Math.max(1,devicePixelRatio/1.7));const scene=new B.Scene(engine);scene.clearColor=new B.Color4(.09,.2,.19,1);const camera=new B.ArcRotateCamera('camera',-Math.PI/2,1.18,22,new B.Vector3(0,4.6,0),scene);camera.attachControl(cv,true);camera.lowerRadiusLimit=13;camera.upperRadiusLimit=34;camera.lowerBetaLimit=.38;camera.upperBetaLimit=1.45;camera.pinchPrecision=130;new B.HemisphericLight('sky',new B.Vector3(0,1,0),scene).intensity=1.25;let sun=new B.DirectionalLight('sun',new B.Vector3(-.7,-1,-.4),scene);sun.intensity=1.7;const ground=B.MeshBuilder.CreateGround('pedestal meadow',{width:30,height:30},scene);const mat=new B.StandardMaterial('ground',scene);mat.diffuseColor=B.Color3.FromHexString('#385c43');ground.material=mat;const tree=createWorldTree(scene,B);let spinning=true,glowing=true;document.getElementById('spin').onclick=()=>{spinning=!spinning;document.getElementById('spin').textContent='⟳ Drehen: '+(spinning?'An':'Aus')};document.getElementById('reset').onclick=()=>{camera.alpha=-Math.PI/2;camera.beta=1.18;camera.radius=22};document.getElementById('runes').onclick=()=>{glowing=!glowing;tree.materials.rune.emissiveColor=glowing?B.Color3.FromHexString('#24e4d3'):B.Color3.Black();document.getElementById('runes').textContent='✧ Runen: '+(glowing?'An':'Aus')};scene.onBeforeRenderObservable.add(()=>{if(spinning)camera.alpha+=scene.getEngine().getDeltaTime()*.00008});engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());
}catch(e){document.getElementById('error').style.display='flex';document.getElementById('error').textContent='3D-Fehler: '+e.message;console.error(e)}
</script></body></html>
