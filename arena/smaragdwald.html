<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ECLIPSE — Smaragdwald Arena Prototype</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#12261d;font-family:system-ui;color:white}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;top:env(safe-area-inset-top,8px);left:12px;background:#10261bc9;padding:9px 13px;border-radius:12px;font-size:12px;pointer-events:none}.hud strong{font-size:16px}.bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#10261bc9;padding:7px;border-radius:12px}button{background:#264c38;color:white;border:1px solid #8fb88c;border-radius:9px;padding:9px;font-size:12px}button.active{background:#428258}.note{position:fixed;right:8px;top:8px;font-size:11px;color:#e6e2b7}</style></head><body><canvas id="view"></canvas><div class="hud"><strong>SMARAGDWALD · Kapitel 1</strong><div>3D-Prototyp · feststehende Kamera</div><div id="status">Goblin läuft zur Weltenbaum-Wurzel</div></div><div class="bar"><button id="build">Baumodus</button><button id="boss">Bosswetter</button><button id="victory">Siegeseffekt</button><button id="reset">Zurücksetzen</button></div><script src="https://cdn.babylonjs.com/babylon.js"></script><script>
const canvas=document.querySelector('canvas'),engine=new BABYLON.Engine(canvas,true,{adaptToDeviceRatio:true}),scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.69,.86,.85,1);scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;scene.fogDensity=.009;scene.fogColor=new BABYLON.Color3(.69,.86,.85);const V=BABYLON.Vector3;const camera=new BABYLON.ArcRotateCamera('fixed',-Math.PI/2,1.04,35,new V(0,0,0),scene);camera.mode=BABYLON.Camera.ORTHOGRAPHIC_CAMERA;camera.inputs.clear();function frame(){const a=engine.getRenderWidth()/engine.getRenderHeight();camera.orthoTop=10;camera.orthoBottom=-10;camera.orthoLeft=-10*a;camera.orthoRight=10*a}frame();new BABYLON.HemisphericLight('sky',new V(0,1,0),scene).intensity=1.15;const sun=new BABYLON.DirectionalLight('sun',new V(-.5,-1,-.6),scene);sun.intensity=.85;
function mat(n,c,em){const m=new BABYLON.StandardMaterial(n,scene);m.diffuseColor=BABYLON.Color3.FromHexString(c);if(em)m.emissiveColor=BABYLON.Color3.FromHexString(em);return m}const grass=mat('meadow','#70a85b'),grass2=mat('meadow edge','#578e4d'),dirt=mat('pale compact earth','#b9a06e'),wood=mat('wood','#75523a'),leaf=mat('canopy','#387b45'),leaf2=mat('canopy bright','#55a65a'),rock=mat('moss rock','#697966'),dark=mat('cave','#15251b'),water=mat('stream','#52b8b4','#0b393b'),rune=mat('turquoise runes','#6cebe1','#20a9a4'),gobskin=mat('goblin','#78963e'),stone=mat('stone','#9a9b7a'),flower=mat('flowers','#e6d5a1');function sphere(n,x,y,z,sx,sy,sz,m){let o=BABYLON.MeshBuilder.CreateSphere(n,{diameter:1,segments:8},scene);o.position.set(x,y,z);o.scaling.set(sx,sy,sz);o.material=m;return o}function cyl(n,x,y,z,d,h,m){let o=BABYLON.MeshBuilder.CreateCylinder(n,{diameter:d,height:h,tessellation:9},scene);o.position.set(x,y,z);o.material=m;return o}function box(n,x,y,z,w,h,d,m){let o=BABYLON.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},scene);o.position.set(x,y,z);o.material=m;return o}
const ground=BABYLON.MeshBuilder.CreateGround('broad buildable meadow',{width:31,height:19},scene);ground.material=grass;for(let i=0;i<38;i++){let x=-16+i*.9;sphere('hills',x,-.7,-10.5,2.8,1.7,2.5,grass2);sphere('distant hills',x,-.7,10.5,2.8,1.5,2.5,grass2)}
// One continuous serpentine path: spawn left, two wide U-turns, goal right.
const path=[[-12,-5],[-9,-5],[-5,-5],[-1,-5],[3,-5],[7,-5],[9,-4],[10,-2],[9,0],[6,0],[2,0],[-2,0],[-6,0],[-9,0],[-10,2],[-9,4],[-5,4],[-1,4],[3,4],[7,4],[11,4]];const P=path.map(([x,z])=>new V(x,.035,z));const curve=BABYLON.Curve3.CreateCatmullRomSpline(P,12,false).getPoints();let lengths=[0];for(let i=1;i<curve.length;i++)lengths.push(lengths[i-1]+V.Distance(curve[i-1],curve[i]));const total=lengths.at(-1);for(let i=1;i<curve.length;i++){const a=curve[i-1],b=curve[i],dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz);let seg=box('single continuous dirt path',(a.x+b.x)/2,.047,(a.z+b.z)/2,1.3,.075,len+.12,dirt);seg.rotation.y=Math.atan2(dx,dz)}
function pointAt(distance){distance=Math.max(0,Math.min(total,distance));let i=1;while(i<lengths.length-1&&lengths[i]<distance)i++;return V.Lerp(curve[i-1],curve[i],(distance-lengths[i-1])/Math.max(.0001,lengths[i]-lengths[i-1]))}
function tree(x,z,s=1,hero=false){cyl('bent trunk',x,1*s,z,.52*s,2*s,wood);sphere('crown',x,2.5*s,z,2.15*s,1.75*s,2.05*s,hero?leaf2:leaf);sphere('leaf cluster',x-.5*s,2.7*s,z+.2*s,1.2*s,1.2*s,1.2*s,leaf2)}
// Cave at left, world tree at right.
sphere('mossy cave mound',-13,1.2,-5,4.3,3.1,4,rock);sphere('dark goblin cave entrance',-12.35,.82,-4.92,1.1,1.65,1.6,dark);for(let i=0;i<5;i++)box('cave timber',-13+i*.3,.7,-6.4,.12,1.1,.15,wood);
tree(12,4,2.05,true);for(let i=0;i<8;i++){let a=i*Math.PI/4;let r=cyl('rune light',12+Math.cos(a)*.62,1.5+i%3*.52,4+Math.sin(a)*.62,.12,.36,rune);r.rotation.z=.22}for(let i=0;i<8;i++){let a=i*Math.PI/4;let root=cyl('luminous root',12+Math.cos(a)*1.4,.14,4+Math.sin(a)*1.4,.2,1.8,wood);root.rotation.z=Math.PI/2}
for(let i=0;i<28;i++){let x=-15+(i*7.83)%30,z=-9.2+(i*5.71)%18.4;if(Math.abs(z+5)<2||Math.abs(z)<1.6||Math.abs(z-4)<2||x>9&&z>1)continue;tree(x,z,.45+(i%4)*.1)}
for(let i=0;i<26;i++){let x=-14+(i*4.13)%28,z=-8.8+(i*7.17)%17.6;if(Math.abs(z+5)<1||Math.abs(z)<1||Math.abs(z-4)<1)continue;sphere('mossy boulder',x,.15,z,.35,.32,.42,rock);sphere('tiny flower',x+.35,.12,z,.12,.16,.12,flower)}
// Decorative stream and footbridge, disconnected from enemy path.
for(let i=0;i<18;i++)box('stream',-14+i*.34,.055,7.35+Math.sin(i*.32)*.35,.5,.035,.58,water);for(let i=0;i<7;i++)box('bridge deck',-11.6+i*.25,.23,7.3,.2,.11,1.7,wood);for(let z of [6.4,8.2])box('bridge railing',-10.8,.48,z,2.4,.12,.13,wood);
const gob=new BABYLON.TransformNode('goblin path follower',scene);const body=sphere('goblin body',0,.45,0,.47,.7,.4,gobskin);body.parent=gob;const head=sphere('goblin head',0,1,0,.55,.5,.53,gobskin);head.parent=gob;for(let s of [-1,1]){let ear=sphere('goblin ear',s*.38,1.08,0,.32,.18,.2,gobskin);ear.parent=gob}let travel=0,boss=false,build=false,win=0;let markers=[];const buildButton=document.getElementById('build');buildButton.onclick=()=>{build=!build;buildButton.classList.toggle('active',build);markers.forEach(m=>m.setEnabled(build))};const gridmat=mat('build mode grid','#8bdb7b');gridmat.alpha=.28;for(let x=-14;x<=14;x+=2){let m=box('grid x',x,.085,0,.025,.012,18,gridmat);markers.push(m)}for(let z=-8;z<=8;z+=2){let m=box('grid z',0,.085,z,28,.012,.025,gridmat);markers.push(m)}markers.forEach(m=>m.setEnabled(false));document.getElementById('boss').onclick=()=>{boss=!boss;scene.clearColor=boss?new BABYLON.Color4(.28,.36,.41,1):new BABYLON.Color4(.69,.86,.85,1);sun.intensity=boss?.42:.85};document.getElementById('victory').onclick=()=>win=3;document.getElementById('reset').onclick=()=>{travel=0;win=0;boss=false;scene.clearColor=new BABYLON.Color4(.69,.86,.85,1);sun.intensity=.85};let time=0;scene.onBeforeRenderObservable.add(()=>{let dt=Math.min(.05,engine.getDeltaTime()/1000);time+=dt;travel=(travel+dt*1.5)%total;let p=pointAt(travel),q=pointAt(Math.min(total,travel+.12));gob.position.set(p.x,.12+Math.abs(Math.sin(time*9))*.06,p.z);gob.rotation.y=Math.atan2(q.x-p.x,q.z-p.z);if(win>0){win-=dt;rune.emissiveColor=new BABYLON.Color3(.4+Math.max(0,win)/3,.95,.8)}else rune.emissiveColor=new BABYLON.Color3(.08,.48,.43)});engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>{engine.resize();frame()});</script></body></html>
