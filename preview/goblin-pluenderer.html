<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ECLIPSE: ASCENSION – Goblin-Plünderer Vorschau</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b20;color:#fff;font-family:system-ui}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;left:16px;top:12px;pointer-events:none;text-shadow:0 2px 4px #000}.hud b{font-size:20px}.hud p{font-size:12px;opacity:.85;margin:5px 0}.controls{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px}button{background:#243e37;color:#fff;border:1px solid #82b991;border-radius:12px;padding:12px 15px;font-size:14px}</style></head><body><canvas id="scene"></canvas><div class="hud"><b>ECLIPSE: ASCENSION</b><p>Goblin-Plünderer V1.0 · 3D-Blockout, kein finales Asset</p><p>Mit dem Finger drehen · Zwei Finger zoomen</p></div><div class="controls"><button id="walk">Lauf: An</button><button id="turn">Ansicht zurücksetzen</button></div><script src="https://cdn.babylonjs.com/babylon.js"></script><script>
const canvas=document.getElementById('scene'),engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true});const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.07,.12,.15,1);const camera=new BABYLON.ArcRotateCamera('cam',-Math.PI/2,1.17,7.8,new BABYLON.Vector3(0,1.25,0),scene);camera.attachControl(canvas,true);camera.lowerRadiusLimit=4;camera.upperRadiusLimit=12;camera.wheelPrecision=60;camera.pinchPrecision=110;new BABYLON.HemisphericLight('sky',new BABYLON.Vector3(0,1,0),scene).intensity=.85;const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-1,-2,-1),scene);sun.intensity=1.1;
function mat(name,color){let m=new BABYLON.StandardMaterial(name,scene);m.diffuseColor=BABYLON.Color3.FromHexString(color);return m}
const skin=mat('olive green skin','#6f8b3d'),skinDark=mat('dark olive','#435d2a'),leather=mat('patched leather','#644631'),leather2=mat('leather patch','#987044'),metal=mat('dagger steel','#c2c6c0'),dark=mat('dark eyes','#17150f'),white=mat('teeth','#dfd9b5'),earth=mat('ground','#36493a');
let ground=BABYLON.MeshBuilder.CreateCylinder('display platform',{diameter:5.6,height:.25,tessellation:64},scene);ground.position.y=-.15;ground.material=earth;
let root=new BABYLON.TransformNode('goblin',scene);
function sphere(name,x,y,z,sx,sy,sz,m,parent=root){let a=BABYLON.MeshBuilder.CreateSphere(name,{diameter:1,segments:12},scene);a.parent=parent;a.position.set(x,y,z);a.scaling.set(sx,sy,sz);a.material=m;return a}
function box(name,x,y,z,w,h,d,m,parent=root){let a=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);a.parent=parent;a.position.set(x,y,z);a.material=m;return a}
let body=new BABYLON.TransformNode('hunched torso',scene);body.parent=root;body.position.y=1.28;body.rotation.x=.22;
sphere('chest',0,.22,0,.54,.67,.36,leather,body);sphere('hump',0,.36,-.24,.5,.48,.36,leather2,body);box('leather patch',-.19,.25,-.29,.22,.29,.08,leather,body);
let head=new BABYLON.TransformNode('head',scene);head.parent=body;head.position.set(0,.73,.19);sphere('face',0,0,0,.62,.53,.52,skin,head);
for(let side of [-1,1]){let ear=sphere('pointed ear',side*.43,.08,0,.35,.17,.18,skin,head);ear.rotation.z=side*.45;sphere('eye',side*.18,.08,.42,.105,.075,.055,dark,head);sphere('brow',side*.18,.19,.42,.2,.07,.08,skinDark,head);sphere('tooth',side*.13,-.27,.41,.06,.13,.06,white,head)}
sphere('long nose',0,-.08,.48,.18,.21,.24,skinDark,head);sphere('smirk',0,-.29,.39,.25,.045,.07,dark,head);
let legs=[],arms=[];for(let side of [-1,1]){let leg=new BABYLON.TransformNode('leg',scene);leg.parent=root;leg.position.set(side*.24,.84,0);sphere('leg',0,-.28,0,.21,.47,.23,skinDark,leg);sphere('boot',0,-.64,.12,.23,.18,.37,leather,leg);legs.push(leg);let arm=new BABYLON.TransformNode('arm',scene);arm.parent=body;arm.position.set(side*.39,.35,0);sphere('arm',side*.08,-.29,.03,.2,.48,.2,skin,arm);sphere('hand',side*.12,-.58,.06,.17,.18,.17,skinDark,arm);let grip=box('dagger grip',side*.13,-.75,.11,.09,.27,.09,leather,arm);let blade=BABYLON.MeshBuilder.CreateCylinder('short dagger blade',{diameterTop:0,diameterBottom:.14,height:.42,tessellation:4},scene);blade.parent=arm;blade.position.set(side*.13,-1.04,.11);blade.material=metal;arms.push(arm)}
let walk=true,t=0;document.getElementById('walk').onclick=()=>{walk=!walk;document.getElementById('walk').textContent='Lauf: '+(walk?'An':'Aus')};document.getElementById('turn').onclick=()=>{camera.alpha=-Math.PI/2;camera.beta=1.17;camera.radius=7.8};scene.onBeforeRenderObservable.add(()=>{t+=engine.getDeltaTime()/1000;let a=walk?Math.sin(t*8)*.38:0;legs[0].rotation.x=a;legs[1].rotation.x=-a;arms[0].rotation.x=-a*.8;arms[1].rotation.x=a*.8;root.position.y=walk?Math.abs(Math.sin(t*8))*.055:0;head.rotation.y=walk?Math.sin(t*1.8)*.1:0});engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());
</script></body></html>
